<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flores de luz · Para ti</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f4efd9;font-family:Georgia,serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}header{position:fixed;top:32px;left:38px;z-index:2}.eyebrow{font:10px monospace;letter-spacing:3px;color:#99917c}h1{font-size:25px;font-weight:400;margin:10px 0}footer{padding:18px 8px 0;background:linear-gradient(transparent,#000c 40%);position:fixed;bottom:30px;left:20px;right:20px;text-align:center;pointer-events:none}#message{max-width:900px;margin-inline:auto;overflow-wrap:anywhere;white-space:pre-line;font-size:clamp(20px,3vw,34px);font-style:italic;margin:0 0 12px;text-shadow:0 2px 16px #000}#signature{font:11px monospace;color:#9d9787;letter-spacing:2px}.tools{position:fixed;right:30px;top:32px;display:flex;gap:8px;z-index:3}button{border:1px solid #38372f;background:#090a08d9;color:#c9c5b1;border-radius:30px;padding:11px 17px;cursor:pointer;font:11px monospace}button:hover{border-color:#b7a96f;color:#fff}dialog{background:#10120e;color:#eae5cf;border:1px solid #444634;border-radius:18px;padding:28px;width:min(440px,90vw)}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}label{display:block;font:12px monospace;margin:18px 0 8px}input,textarea{width:100%;background:#000;color:#eee8cf;border:1px solid #3b3d30;border-radius:6px;padding:12px;font:15px Georgia}textarea{resize:vertical;min-height:90px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}#hint{position:fixed;bottom:18px;right:22px;font:9px monospace;color:#514f43}@media(max-width:600px){header{top:22px;left:22px}h1{font-size:20px}.tools{top:22px;right:18px;flex-direction:column}button{font-size:10px;padding:9px 12px}footer{bottom:48px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Ramo animado de peonías de colores dibujados con caracteres ASCII"></canvas>
<header><div class="eyebrow">UN PEQUEÑO GESTO DIGITAL</div><h1>Flores de luz<span style="color:#a89d67"> ✳</span></h1></header>
<div class="tools"><button id="edit">Escribir dedicatoria</button><button id="share">Copiar enlace ♡</button><button id="replay">Volver a florecer ↻</button></div>
<footer><p id="message">Hay flores que nunca se marchitan.</p><div id="signature">ESTAS SON PARA TI</div></footer><div id="hint">HECHO DE LETRAS, PENSADO PARA TI</div>
<dialog id="editor"><form id="form"><h2 style="font-weight:400;margin-top:0">Dilo con flores.</h2><label for="text">TU MENSAJE</label><textarea id="text" maxlength="140">Hay flores que nunca se marchitan.</textarea><label for="from">UNA FIRMA, UN NOMBRE, LO QUE QUIERAS</label><input id="from" maxlength="60" value="Estas son para ti"><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Guardar dedicatoria ↗</button></div><p style="font:10px monospace;color:#999">Guarda tu mensaje y copia el enlace para regalar estas flores.</p></form></dialog>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const source=document.createElement('canvas');source.width=700;source.height=900;const p=source.getContext('2d');
let seed=21;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function range(a,b){return a+(b-a)*random()}
// Fuente procedural: pétalos, vetas y estambres; no necesita archivos externos.
function leaf(x,y,angle,len,width){p.save();p.translate(x,y);p.rotate(angle);let g=p.createLinearGradient(0,0,0,-len);g.addColorStop(0,'#17472c');g.addColorStop(.5,'#629f49');g.addColorStop(1,'#bed779');p.fillStyle=g;p.beginPath();p.moveTo(0,0);p.bezierCurveTo(-width,-len*.5,-width*.2,-len*.85,0,-len);p.bezierCurveTo(width*.25,-len*.75,width,-len*.25,0,0);p.fill();p.strokeStyle='#acbe6680';p.lineWidth=1;p.beginPath();p.moveTo(0,0);p.lineTo(0,-len);p.stroke();p.restore()}
// Peonías: coronas de pétalos redondeados, con bordes ondulados y pliegues.
function flower(x,y,size,color,rotation){p.save();p.translate(x,y);p.rotate(rotation);p.scale(1,.88);
for(let ring=0;ring<7;ring++){let radius=size*(1-ring*.125),count=11+ring*2;for(let i=0;i<count;i++){p.save();p.rotate(i*Math.PI*2/count+ring*1.74+range(-.1,.1));let length=radius*range(.9,1.08),w=radius*range(.25,.39),base=radius*.17;let g=p.createLinearGradient(-w,0,w,-length);g.addColorStop(0,color[0]);g.addColorStop(.5,color[1]);g.addColorStop(.88,color[2]);g.addColorStop(1,color[1]);p.fillStyle=g;p.beginPath();p.moveTo(-w*.18,-base);p.bezierCurveTo(-w*1.2,-length*.4,-w*1.15,-length*.83,-w*.65,-length*.95);p.bezierCurveTo(-w*.42,-length*1.08,-w*.15,-length*.91,0,-length);p.bezierCurveTo(w*.28,-length*1.08,w*.4,-length*.94,w*.68,-length*.96);p.bezierCurveTo(w*1.12,-length*.83,w*.95,-length*.36,w*.18,-base);p.closePath();p.fill();p.strokeStyle=color[2]+'88';p.lineWidth=.9;p.stroke();for(let j=0;j<5;j++){let xx=(j-2)*w*.23;p.strokeStyle=j%2?'#ffffff20':'#4d133b25';p.lineWidth=.7;p.beginPath();p.moveTo(0,-base);p.quadraticCurveTo(xx*.6,-length*.65,xx,-length*.94);p.stroke()}p.restore()}}
p.restore()}
function bouquet(){seed=21;p.clearRect(0,0,700,900);for(let i=0;i<30;i++){let x=range(150,550),y=range(170,650);p.strokeStyle=`rgb(${range(30,65)},${range(75,125)},${range(30,65)})`;p.lineWidth=range(2,5);p.beginPath();p.moveTo(range(320,380),870);p.quadraticCurveTo(range(250,440),610,x,y);p.stroke();leaf(range(230,470),range(450,850),range(-1.5,1.5),range(90,185),range(18,36))}
const blush=['#843c59','#d98ca6','#ffe0e7'],pink=['#792447','#d85f93','#ffbadb'],cream=['#9a7865','#e0c1af','#fff1de'],wine=['#561533','#ae3d70','#ef83af'];
flower(305,185,112,blush,.3);flower(475,300,116,cream,.6);flower(180,330,116,pink,-.2);flower(355,400,140,blush,.1);flower(520,505,104,wine,.4);flower(165,530,110,cream,.2);flower(285,625,141,pink,-.3);flower(454,675,125,blush,.6)}
bouquet();let W,H,dpr,cells=[],start=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Densidad: disminuir CELL genera más caracteres y detalle.
const CELL=4,chars=' .,:;i+tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const stars=Array.from({length:100},()=>({x:random(),y:random(),r:range(.3,1),phase:range(0,7),speed:range(.4,1)}));
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let height=Math.min(H*.87,1100),width=height*700/900;if(width>W*.96){width=W*.96;height=width*900/700}let left=(W-width)/2,top=(H-height)/2-8;const sample=document.createElement('canvas');sample.width=Math.ceil(width/CELL);sample.height=Math.ceil(height/(CELL*1.55));const s=sample.getContext('2d',{willReadFrequently:true});s.drawImage(source,0,0,sample.width,sample.height);const data=s.getImageData(0,0,sample.width,sample.height).data;cells=[];for(let y=0;y<sample.height;y++)for(let x=0;x<sample.width;x++){let i=(y*sample.width+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];let lum=.2126*r+.7152*g+.0722*b;if(a<65||lum<15)continue;cells.push({x:left+x*CELL,y:top+y*CELL*1.55,color:`rgb(${r},${g},${b})`,char:chars[Math.min(chars.length-1,Math.floor(lum/255*(chars.length-1)))],delay:y/sample.height,noise:random()})}}
function frame(now){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let t=(now-start)/1000;for(const s of stars){ctx.globalAlpha=reduce?.3:.15+(Math.sin(now*.0006*s.speed+s.phase)+1)*.2;ctx.fillStyle='#c4c5b0';ctx.beginPath();ctx.arc(s.x*W,(s.y*H+(reduce?0:t*s.speed*2))%H,s.r,0,7);ctx.fill()}ctx.font=`${CELL*1.5}px 'Courier New',monospace`;ctx.textBaseline='top';for(const c of cells){let age=reduce?2:t-c.delay*3.3-c.noise*.3;if(age<0)continue;ctx.globalAlpha=Math.min(1,age*1.8);ctx.fillStyle=c.color;ctx.fillText(age<.45?chars[Math.floor((c.noise*73+t*18)%chars.length)]:c.char,c.x,c.y)}ctx.globalAlpha=1;requestAnimationFrame(frame)}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);document.querySelector('#replay').onclick=()=>start=performance.now();
const editor=document.querySelector('#editor'),text=document.querySelector('#text'),from=document.querySelector('#from');function apply(){document.querySelector('#message').textContent=text.value;document.querySelector('#signature').textContent=from.value.toUpperCase()}
// El fragmento de la URL contiene la dedicatoria; GitHub Pages sirve el mismo HTML.
function readLink(){const params=new URLSearchParams(location.hash.slice(1));if(!params.has('m'))return false;text.value=(params.get('m')||'').slice(0,140);from.value=(params.get('f')||'').slice(0,60);apply();return true}
if(!readLink()){try{const saved=JSON.parse(localStorage.getItem('flores-dedication'));if(saved&&typeof saved.text==='string'&&typeof saved.from==='string'){text.value=saved.text.slice(0,140);from.value=saved.from.slice(0,60);apply()}}catch{}}
addEventListener('hashchange',readLink);
function link(){const url=new URL(location.href);url.hash=new URLSearchParams({m:text.value,f:from.value}).toString();return url.href}
document.querySelector('#edit').onclick=()=>editor.showModal();document.querySelector('#cancel').onclick=()=>editor.close();document.querySelector('#form').onsubmit=e=>{e.preventDefault();apply();try{localStorage.setItem('flores-dedication',JSON.stringify({text:text.value,from:from.value}))}catch{}location.hash=new URL(link()).hash;editor.close()};
const share=document.querySelector('#share');share.onclick=async()=>{const url=link();if(location.protocol==='file:'){window.alert('Cuando publiques esta página en GitHub Pages, este botón copiará tu enlace compartible. Por ahora puedes editar y ver tu dedicatoria aquí.');return}try{await navigator.clipboard.writeText(url);share.textContent='Enlace copiado ✓';setTimeout(()=>share.textContent='Copiar enlace ♡',2200)}catch{window.prompt('Copia este enlace para compartir tu dedicatoria:',url)}};
</script>
</body></html>
