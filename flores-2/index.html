<!doctype html>
<html lang="es">

<title>Flores de luz · Nocturno</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#f4efd9;font-family:Georgia,serif}body{height:100svh;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}header{position:fixed;top:max(24px,env(safe-area-inset-top));left:32px;z-index:2}h1{font-size:25px;font-weight:400;margin:0}footer{position:fixed;bottom:calc(46px + env(safe-area-inset-bottom));left:24px;right:24px;text-align:center;pointer-events:none}#message{max-width:760px;overflow-wrap:anywhere;white-space:pre-line;font-size:clamp(20px,3vw,34px);line-height:1.35;font-style:italic;margin:0 auto 12px;text-wrap:pretty}#signature{max-width:650px;margin:auto;overflow-wrap:anywhere;font:11px/1.6 monospace;color:#9d9787;letter-spacing:2px}.tools{position:fixed;right:30px;top:24px;display:flex;gap:8px;z-index:3}button{min-height:44px;border:1px solid #38372f;background:#090a08e8;color:#c9c5b1;border-radius:24px;padding:10px 15px;cursor:pointer;font:11px monospace}button:hover{border-color:#b7a96f;color:#fff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #d98ca6;outline-offset:3px}dialog{background:#10120e;color:#eae5cf;border:1px solid #444634;border-radius:18px;padding:24px;width:min(440px,92vw);max-height:85dvh;overflow:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}label{display:block;font:12px/1.5 monospace;margin:18px 0 8px}input,textarea{width:100%;background:#000;color:#eee8cf;border:1px solid #3b3d30;border-radius:6px;padding:12px;font:16px Georgia}textarea{resize:vertical;min-height:100px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}#hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));width:100%;text-align:center;font:10px monospace;color:#777164}.gift header,.gift .tools,.gift #hint,.gift dialog{display:none}.gift footer{bottom:calc(24px + env(safe-area-inset-bottom))}@media(max-width:600px){header{top:calc(16px + env(safe-area-inset-top));left:20px}h1{font-size:22px}.tools{top:calc(54px + env(safe-area-inset-top));left:16px;right:16px;gap:6px}.tools button{flex:1;padding:8px 6px;font-size:10px}footer{left:22px;right:22px;bottom:calc(44px + env(safe-area-inset-bottom))}#message{font-size:clamp(19px,5.5vw,25px);line-height:1.4}#signature{font-size:10px;letter-spacing:1.4px}.gift footer{bottom:calc(25px + env(safe-area-inset-bottom))}}@media(max-height:500px) and (min-width:601px){h1{font-size:20px}.tools button{min-height:36px}#message{font-size:20px}footer,.gift footer{left:58%;right:24px;bottom:24%}#hint{width:auto;right:20px}}
</style>

<body>
<canvas id="scene" aria-label="Ramo gótico de rosas y peonías dibujados con caracteres ASCII"></canvas>
<header><h1>Flores de luz · II</h1></header>
<div class="tools"><button id="edit">Escribir dedicatoria</button><button id="share">Copiar enlace</button><button id="replay">Volver a florecer</button></div>
<footer><p id="message">Hay flores que nunca se marchitan.</p><div id="signature">ESTAS SON PARA TI</div></footer><div id="hint">hecho por luis cortés</div>
<dialog id="editor"><form id="form"><h2 style="font-weight:400;margin-top:0">Dilo con flores.</h2><label for="text">TU MENSAJE</label><textarea id="text" maxlength="140">Hay flores que nunca se marchitan.</textarea><label for="from">UNA FIRMA, UN NOMBRE, LO QUE QUIERAS</label><input id="from" maxlength="60" value="Estas son para ti"><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Guardar dedicatoria</button></div><p style="font:10px monospace;color:#999">Guarda tu mensaje y copia el enlace para regalar estas flores.</p></form></dialog>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=1000;source.height=1100;const p=source.getContext('2d');let seed=4821;const random=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),rand=(a,b)=>a+(b-a)*random(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Nueva composición: un ramo ovalado sostenido por un haz de tallos central.
const crimson=['#360b24','#a51b43','#ef4d68','#ffafa8'],wine=['#210e26','#70274f','#b75c85','#eda4b9'],obsidian=['#121923','#343247','#716278','#b0a0b6'],bone=['#59423c','#b99580','#f1d7b5','#fff3dd'];
function curve(a,b,c,d,color,width){p.strokeStyle=color;p.lineWidth=width;p.lineCap='round';p.beginPath();p.moveTo(...a);p.bezierCurveTo(...b,...c,...d);p.stroke()}
function foliage(x,y,len,angle){p.save();p.translate(x,y);p.rotate(angle);let g=p.createLinearGradient(-len*.2,0,len*.2,-len);g.addColorStop(0,'#102b24');g.addColorStop(.52,'#3f7e48');g.addColorStop(.85,'#8bbd68');g.addColorStop(1,'#c6d88a');p.fillStyle=g;p.beginPath();p.moveTo(0,0);for(let side of [-1,1]){if(side===1)p.moveTo(0,-len);p.bezierCurveTo(side*len*.24,-len*(side<0?.24:.83),side*len*.3,-len*(side<0?.66:.35),0,side<0?-len:0)}p.fill();p.strokeStyle='#b7d18e88';p.lineWidth=.9;p.beginPath();p.moveTo(0,0);p.lineTo(0,-len);for(let i=1;i<7;i++){let h=i/8;p.moveTo(0,-len*h);p.lineTo(-len*.19*Math.sin(h*Math.PI),-len*(h+.12));p.moveTo(0,-len*h);p.lineTo(len*.19*Math.sin(h*Math.PI),-len*(h+.12))}p.stroke();p.restore()}
// Pétales asymétriques, aux rebords plissés et aux bases sombres.
function flower(x,y,r,colors,kind,tilt){p.save();p.translate(x,y);p.rotate(tilt);p.scale(1,kind==='bud'?.76:.87);let rings=kind==='peony'?8:6;
for(let ring=0;ring<rings;ring++){let rad=r*Math.pow(.77,ring),count=kind==='peony'?12+ring:5+ring%2,phase=ring*(kind==='peony'?1.37:2.39);for(let i=0;i<count;i++){p.save();p.rotate(i*2*Math.PI/count+phase+rand(-.09,.09));let length=rad*rand(.92,1.08),w=rad*(kind==='peony'?rand(.29,.39):.78);let g=p.createLinearGradient(-w*.4,-length*.2,w*.25,-length);g.addColorStop(0,colors[0]);g.addColorStop(.38,colors[1]);g.addColorStop(.78,colors[2]);g.addColorStop(1,colors[3]);p.fillStyle=g;p.beginPath();p.moveTo(-w*.14,-rad*.06);p.bezierCurveTo(-w*.7,-length*.25,-w*1.08,-length*.8,-w*.53,-length*.95);if(kind==='peony'){p.bezierCurveTo(-w*.35,-length*1.08,-w*.12,-length*.9,0,-length);p.bezierCurveTo(w*.13,-length*1.09,w*.35,-length*.91,w*.59,-length*.95)}else p.bezierCurveTo(-w*.1,-length*1.12,w*.45,-length*1.05,w*.7,-length*.83);p.bezierCurveTo(w*1.04,-length*.51,w*.42,-length*.17,w*.12,-rad*.06);p.closePath();p.fill();p.strokeStyle=colors[3]+'85';p.lineWidth=1.35;p.stroke();for(let j=0;j<5;j++){let xx=(j-2)*w*.16;p.strokeStyle=j%2?colors[3]+'30':colors[0]+'55';p.lineWidth=.8;p.beginPath();p.moveTo(0,-rad*.1);p.quadraticCurveTo(xx*.7,-length*.6,xx,-length*.94);p.stroke()}p.restore()}}p.restore()}
function build(){seed=937;p.clearRect(0,0,1000,1100);
// Arrière-plan végétal : lignes ascendantes et feuilles groupées, pas de remplissage aléatoire.
const leaves=[[345,270,130,-.65],[625,245,135,.55],[255,405,145,-1],[750,400,145,.95],[205,570,135,-1.15],[790,590,125,1.12],[280,760,130,-1.05],[700,805,120,.9],[425,905,145,-.6],[570,920,140,.65],[370,380,105,-.25],[635,625,110,.6]];
for(const [x,y,len,angle] of leaves){curve([500,1045],[490,880],[x,y+180],[x,y],'#477a43',2.3);foliage(x,y,len,angle);foliage(x,y+37,len*.6,-angle*.65)}
// Couronne en trois plans : petites fleurs hautes, centre large, base effilée.
const blooms=[
[400,265,88,wine,'rose',-.35],[565,235,100,crimson,'peony',.3],
[695,360,106,obsidian,'rose',.4],[285,440,92,crimson,'rose',-.45],
[440,440,137,crimson,'peony',-.22],[625,505,113,bone,'rose',.35],
[765,560,77,wine,'rose',.65],[270,635,90,obsidian,'rose',-.5],
[455,675,126,wine,'peony',-.15],[645,730,105,crimson,'rose',.32],
[415,845,91,obsidian,'rose',-.2],[550,890,75,crimson,'bud',.4]];
for(const [x,y] of blooms){curve([500+rand(-16,16),1055],[485,905],[x+(500-x)*.2,y+160],[x,y],'#63934e',rand(2,4))}
// Quelques boutons et une seule branche ivoire, en retrait des grandes fleurs.
for(const [x,y] of [[270,300],[730,290],[800,470]]){curve([500,1000],[600,600],[x-30,y+80],[x,y],'#6e9856',1.7);foliage(x,y+25,52,.6);flower(x,y,25,wine,'bud',.4)}
for(let i=0;i<7;i++){let x=220+Math.sin(i*1.8)*23,y=460+i*35;curve([370,840],[280,640],[200,y+50],[x,y],'#6b9658',1.1);flower(x,y,rand(9,15),bone,'rose',rand(-1,1))}
for(const f of blooms)flower(...f);
// Feuilles avant : elles réunissent le bas du bouquet sans cacher les corolles.
foliage(465,1000,150,-.7);foliage(540,1010,140,.65);foliage(500,1040,100,.1);
}
build();const range=rand;let W,H,dpr,cells=[],start=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Densidad: disminuir CELL genera más caracteres y detalle.
let CELL=4;const chars=' .,:;i+tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const stars=Array.from({length:100},()=>({x:random(),y:random(),r:range(.3,1),phase:range(0,7),speed:range(.4,1)}));
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const gift=document.documentElement.classList.contains('gift'),wide=W>600&&H<500;const bottom=document.querySelector('footer').getBoundingClientRect().top-12;const controls=document.querySelector('.tools').getBoundingClientRect();const upper=gift?Math.max(12,H*.025):controls.bottom+18;const available=Math.max(60,bottom-upper);let height=Math.min(available,1100),width=height*1000/1100;const maxWidth=wide?W*.52:W*.98;if(width>maxWidth){width=maxWidth;height=width*1100/1000}let left=wide?(W*.54-width)/2:(W-width)/2,top=upper+Math.max(0,(available-height)*.45);CELL=W<=600?2.6:4;const sample=document.createElement('canvas');sample.width=Math.ceil(width/CELL);sample.height=Math.ceil(height/(CELL*1.55));const s=sample.getContext('2d',{willReadFrequently:true});s.drawImage(source,0,0,sample.width,sample.height);const data=s.getImageData(0,0,sample.width,sample.height).data;cells=[];for(let y=0;y<sample.height;y++)for(let x=0;x<sample.width;x++){let i=(y*sample.width+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];let lum=.2126*r+.7152*g+.0722*b;if(a<65||lum<15)continue;cells.push({x:left+x*CELL,y:top+y*CELL*1.55,color:`rgb(${r},${g},${b})`,char:chars[Math.min(chars.length-1,Math.floor(lum/255*(chars.length-1)))],delay:y/sample.height,noise:random()})}}
function frame(now){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let t=(now-start)/1000;for(const s of stars){ctx.globalAlpha=reduce?.3:.15+(Math.sin(now*.0006*s.speed+s.phase)+1)*.2;ctx.fillStyle='#c4c5b0';ctx.beginPath();ctx.arc(s.x*W,(s.y*H+(reduce?0:t*s.speed*2))%H,s.r,0,7);ctx.fill()}ctx.font=`${CELL*1.5}px 'Courier New',monospace`;ctx.textBaseline='top';for(const c of cells){let age=reduce?2:t-c.delay*3.3-c.noise*.3;if(age<0)continue;ctx.globalAlpha=Math.min(1,age*1.8);ctx.fillStyle=c.color;ctx.fillText(age<.45?chars[Math.floor((c.noise*73+t*18)%chars.length)]:c.char,c.x,c.y)}ctx.globalAlpha=1;requestAnimationFrame(frame)}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);new ResizeObserver(()=>requestAnimationFrame(resize)).observe(document.querySelector('footer'));resize();requestAnimationFrame(frame);document.querySelector('#replay').onclick=()=>start=performance.now();
const editor=document.querySelector('#editor'),text=document.querySelector('#text'),from=document.querySelector('#from');function apply(){document.querySelector('#message').textContent=text.value;document.querySelector('#signature').textContent=from.value.toUpperCase();document.querySelector('#signature').hidden=!from.value.trim();requestAnimationFrame(resize)}
// El fragmento de la URL contiene la dedicatoria; GitHub Pages sirve el mismo HTML.
function readLink(){const params=new URLSearchParams(location.hash.slice(1));document.documentElement.classList.toggle('gift',params.has('m'));if(!params.has('m')){requestAnimationFrame(resize);return false;}text.value=(params.get('m')||'').slice(0,140);from.value=(params.get('f')||'').slice(0,60);apply();return true}
if(!readLink()){try{const saved=JSON.parse(localStorage.getItem('flores-2-dedication'));if(saved&&typeof saved.text==='string'&&typeof saved.from==='string'){text.value=saved.text.slice(0,140);from.value=saved.from.slice(0,60);apply()}}catch{}}
addEventListener('hashchange',readLink);
function link(){const url=new URL(location.href);url.hash=new URLSearchParams({m:text.value,f:from.value}).toString();return url.href}
document.querySelector('#edit').onclick=()=>editor.showModal();document.querySelector('#cancel').onclick=()=>editor.close();document.querySelector('#form').onsubmit=e=>{e.preventDefault();apply();try{localStorage.setItem('flores-2-dedication',JSON.stringify({text:text.value,from:from.value}))}catch{}editor.close()};
const share=document.querySelector('#share');share.onclick=async()=>{const url=link();if(location.protocol==='file:'){window.alert('Cuando publiques esta página en GitHub Pages, este botón copiará tu enlace compartible. Por ahora puedes editar y ver tu dedicatoria aquí.');return}try{await navigator.clipboard.writeText(url);share.textContent='Enlace copiado';setTimeout(()=>share.textContent='Copiar enlace',2200)}catch{window.prompt('Copia este enlace para compartir tu dedicatoria:',url)}};
</script>
