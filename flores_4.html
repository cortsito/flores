<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herbario nocturno</title><style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas aria-label="Ramo original de rosas, peonías y flores pequeñas, enteramente dibujado con caracteres"></canvas><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),art=document.createElement('canvas');art.width=1000;art.height=1100;const p=art.getContext('2d');let seed=4821;const random=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),rand=(a,b)=>a+(b-a)*random(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function build(){seed=937;p.clearRect(0,0,1000,1100);
// Arrière-plan végétal : lignes ascendantes et feuilles groupées, pas de remplissage aléatoire.

const blooms=[
[400,265,88,wine,'rose',-.35],[565,235,100,crimson,'peony',.3],
[695,360,106,obsidian,'rose',.4],[285,440,92,crimson,'rose',-.45],
[440,440,137,crimson,'peony',-.22],[625,505,113,bone,'rose',.35],
[765,560,77,wine,'rose',.65],[270,635,90,obsidian,'rose',-.5],
[455,675,126,wine,'peony',-.15],[645,730,105,crimson,'rose',.32],
[415,845,91,obsidian,'rose',-.2],[550,890,75,crimson,'bud',.4]];

for(let i=0;i<7;i++){let x=220+Math.sin(i*1.8)*23,y=460+i*35;curve([370,840],[280,640],[200,y+50],[x,y],'#6b9658',1.1);flower(x,y,rand(9,15),bone,'rose',rand(-1,1))}

build();let W,H,cells=[],background,start=performance.now(),raf;function resize(){cancelAnimationFrame(raf);W=innerWidth;H=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);background='#000';let scale=Math.min(W*.99/1000,H*.98/1100),width=1000*scale,height=1100*scale,left=(W-width)/2,top=(H-height)/2;let step=W<600?2.7:3.7,row=step*1.5;const sample=document.createElement('canvas');sample.width=Math.ceil(width/step);sample.height=Math.ceil(height/row);const sc=sample.getContext('2d',{willReadFrequently:true});sc.drawImage(art,0,0,sample.width,sample.height);const data=sc.getImageData(0,0,sample.width,sample.height).data;cells=[];const ramp='.,:;+=xX%#@';for(let y=0;y<sample.height;y++)for(let x=0;x<sample.width;x++){let n=(y*sample.width+x)*4,a=data[n+3];if(a<30)continue;let r=data[n],g=data[n+1],b=data[n+2],lum=.2126*r+.7152*g+.0722*b;cells.push({x:left+x*step,y:top+y*row,color:`rgb(${r},${g},${b})`,alpha:a/255,char:ramp[Math.min(10,Math.floor(Math.pow(lum/255,.7)*11))],delay:(1-y/sample.height)*5+random()*.22})}ctx.font=`${step*1.6}px 'Courier New',monospace`;ctx.textBaseline='top';raf=requestAnimationFrame(frame)}
