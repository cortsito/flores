<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flor · Pixel botánico</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#073e54;color:#ecf4dd;font-family:monospace}main{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:18px;padding:26px 18px}canvas{width:min(74vw,410px,58svh);height:auto;image-rendering:pixelated;image-rendering:crisp-edges}h1{font:400 24px Georgia;margin:0}p{font-size:11px;line-height:1.7;text-align:center;color:#acd0cc;max-width:420px;margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{border:1px solid #568884;background:#105064;color:#edf4df;padding:11px 14px;border-radius:4px;font:11px monospace;cursor:pointer}button:hover,button[aria-pressed=true]{background:#dbead3;color:#15434b}button:focus-visible{outline:2px solid #f5bf62;outline-offset:3px}.label{font:9px monospace;letter-spacing:2px;color:#92bdb8}@media(max-width:600px){main{gap:16px}canvas{width:min(87vw,56svh)}}</style></head><body><main><div class="label">ESTUDIO BOTÁNICO / PIXEL PROCEDURAL</div><canvas width="168" height="208" aria-label="Flor de pétalos dibujados píxel por píxel, con hojas y centro dorado"></canvas><h1>Una flor, escrita en píxeles.</h1><p>Sin fotografía ni textura de origen. Cada pétalo tiene su propia forma, pliegue, luz y sombra.</p><div class="controls"><button id="ivory" aria-pressed="true">Marfil</button><button id="pink" aria-pressed="false">Rosa</button><button id="new">Otra flor</button></div><div class="label" id="seed"></div></main><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let seed=37,tone='ivory';const palettes={ivory:['#14495b','#367080','#70a0a5','#b3ccc3','#e3e8d4','#fff6dd'],pink:['#492942','#79435c','#ac5f7c','#d889a1','#edb3bf','#ffe2d7']};const greens=['#113d3d','#15554a','#1b7356','#329267','#62ac77'];let state;function rand(){state=(state*1664525+1013904223)>>>0;return state/4294967296}function noise(x,y,n=0){let v=Math.sin(x*127.1+y*311.7+n*74.7+seed)*43758.5453;return v-Math.floor(v)}
function pixel(x,y,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),1,1)}
// Chaque pixel est décidé dans le repère local du pétale; pas de photo ni de Bézier rasterisée.
function petal(cx,cy,angle,base,len,width,phase,ring){const cs=Math.cos(angle),sn=Math.sin(angle),colors=palettes[tone],bound=Math.ceil(base+len+width+2);for(let y=Math.max(0,Math.floor(cy-bound));y<Math.min(208,cy+bound);y++)for(let x=Math.max(0,Math.floor(cx-bound));x<Math.min(168,cx+bound);x++){let dx=x-cx,dy=y-cy,u=dx*cs+dy*sn,v=-dx*sn+dy*cs,t=(u-base)/len;if(t<0||t>1)continue;let profile=Math.pow(Math.sin(Math.PI*t),.62),ruffle=1+.1*Math.sin(t*19+phase)+.05*Math.sin(t*41+phase),half=width*profile*ruffle;if(Math.abs(v)>half)continue;let edge=half-Math.abs(v),fold=v/(half||1),ridge=Math.cos(fold*5+t*7+phase)*.46,light=3.6+(-dx*.011-dy*.018)+ridge+(t>.52?.45:-.45);if(edge<1.2)light+=.55;if(t<.2)light-=1.5;let vein=Math.abs(v-width*.15*Math.sin(t*5+phase));if(vein<.65&&t>.18&&t<.9)light-=1.4;let fine=(noise(x,y,ring)-.5)*.65;let index=Math.max(0,Math.min(5,Math.floor(light+fine)));pixel(x+1,y+1,colors[0]);pixel(x,y,colors[index])}}
function leaf(ax,ay,bx,by,width){let dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;for(let y=110;y<202;y++)for(let x=15;x<153;x++){let qx=x-ax,qy=y-ay,t=(qx*ux+qy*uy)/len,v=-qx*uy+qy*ux;if(t<0||t>1)continue;let half=width*Math.pow(Math.sin(Math.PI*t),.85);if(Math.abs(v)>half)continue;let edge=half-Math.abs(v),idx=edge<1.5?0:2+(v<0?1:0);if(Math.abs(v)<.7)idx=4;let branch=((t*6)%1)*half;if(Math.abs(Math.abs(v)-branch)<.7&&Math.abs(v)>1)idx=Math.max(1,idx-1);pixel(x,y,greens[idx])}}
function render(){state=seed;ctx.clearRect(0,0,168,208);ctx.fillStyle='#07566c';ctx.fillRect(0,0,168,208);
// Un disque graphique et une tige à épaisseur contrôlée, eux aussi faits de pixels entiers.
for(let y=0;y<208;y++)for(let x=0;x<168;x++)if(((x-84)/81)**2+((y-98)/98)**2<1)pixel(x,y,'#08758a');
for(let y=103;y<197;y++){let x=83+Math.sin((y-100)*.033)*3;for(let k=-2;k<3;k++)pixel(x+k,y,greens[k<0?1:k===1?3:2])}
leaf(85,179,45,144,13);leaf(84,190,129,155,14);
const centerX=84,centerY=78;for(let ring=0;ring<4;ring++){const count=[25,23,19,15][ring],base=[13,11,8,5][ring],length=[50,42,32,23][ring],width=[6.2,7.1,7,6.5][ring],phase=rand()*6.28;for(let i=0;i<count;i++){let angle=i*2*Math.PI/count+phase,variation=.91+rand()*.18;petal(centerX,centerY,angle,base,length*variation,width*(.9+rand()*.2),rand()*7,ring)}}
// Réceptacle et étamines, lumière en haut à gauche; une palette chaude de six tons.
const gold=['#91551f','#bd7524','#de952c','#efad38','#fac651','#ffe29a'];for(let y=63;y<=93;y++)for(let x=68;x<=100;x++){let dx=x-centerX,dy=y-centerY,dist=Math.hypot(dx,dy);if(dist>14+.6*Math.sin(Math.atan2(dy,dx)*9))continue;let idx=Math.floor(3-dx*.07-dy*.09+(noise(x,y,7)-.5)*1.7);pixel(x,y,gold[Math.max(0,Math.min(5,idx))]);if((x*3+y*7)%11===0)pixel(x,y,gold[Math.max(0,Math.min(5,idx+1))])}
document.querySelector('#seed').textContent='168 × 208 PIXELS / VARIATION '+seed;for(const name of ['ivory','pink'])document.querySelector('#'+name).setAttribute('aria-pressed',String(tone===name))}
document.querySelector('#ivory').onclick=()=>{tone='ivory';render()};document.querySelector('#pink').onclick=()=>{tone='pink';render()};document.querySelector('#new').onclick=()=>{seed+=13;render()};render();
</script></body></html>
