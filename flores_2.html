<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11171a"><title>Flores · Nocturno</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11171a}canvas{display:block;width:100%;height:100%;position:fixed;inset:0}</style></head><body><canvas aria-label="Raíces que crecen desde la esquina inferior izquierda y florecen en rosas y peonías carmesí, negras y blancas"></canvas><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,dpr,paths=[],blooms=[],leaves=[],start=performance.now(),seed=173,background;
const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),between=(a,b)=>a+(b-a)*rnd(),clamp=x=>Math.max(0,Math.min(1,x));
const palettes=[['#210a16','#74192d','#c74350','#ef8b84'],['#120f1a','#29202e','#55404d','#92616b'],['#4a1724','#a62c43','#df6270','#f8a6a2'],['#65545b','#bdb2ae','#e8e1ce','#fff5df']];
// Coordenadas normalizadas: la raíz del ramo siempre nace abajo a la izquierda.
const origin={x:.105,y:.84};
function point(a,b,c,d,t){let q=1-t;return {x:q*q*q*a.x+3*q*q*t*b.x+3*q*t*t*c.x+t*t*t*d.x,y:q*q*q*a.y+3*q*q*t*b.y+3*q*t*t*c.y+t*t*t*d.y}}
function addPath(a,b,c,d,time,duration,width,color){paths.push({a,b,c,d,time,duration,width,color})}
function build(){seed=173;paths=[];blooms=[];leaves=[];
// Las raíces se dibujan antes de que empiece a subir el tallo.
for(let i=0;i<16;i++){let end={x:between(-.06,.39),y:between(.94,1.11)},middle={x:between(.02,.22),y:between(.89,.95)};addPath(origin,{x:origin.x+between(-.05,.06),y:.91},middle,end,between(0,.5),1.7,between(.6,2),'#a08e7d');for(let j=0;j<3;j++){let t=between(.35,.88),a=point(origin,{x:origin.x,y:.91},middle,end,t),d={x:a.x+between(-.065,.06),y:a.y+between(.025,.09)};addPath(a,a,{x:d.x,y:a.y},d,.7+t,1,between(.3,.8),'#746e63')}}
const targets=[[.21,.54,.073,0],[.34,.30,.083,3],[.49,.13,.09,1],[.68,.23,.10,0],[.87,.10,.077,2],[.88,.43,.10,1],[.67,.52,.095,2],[.43,.61,.087,0],[.84,.71,.089,3],[.58,.79,.067,1],[.15,.18,.065,0],[.94,.29,.055,3]];
for(let i=0;i<targets.length;i++){let [x,y,size,palette]=targets[i],end={x,y},bend={x:x*.7,y:Math.min(.91,y+.28)},time=1.5+i*.1,duration=2.5+(.84-y)*1.4;addPath(origin,{x:.18,y:.72},bend,end,time,duration,between(1.3,3.2),'#6b7b70');blooms.push({x,y,size,palette,type:i%3===0?'rose':'peony',time:time+duration-.35,rotation:between(-1,1),seed:Math.floor(rnd()*100000)});
for(let j=0;j<4;j++){let t=.26+j*.16,a=point(origin,{x:.18,y:.72},bend,end,t);leaves.push({x:a.x,y:a.y,size:between(.035,.065),angle:between(-1.5,1.5)+(j%2?1:-1)*.7,time:time+t*duration})}}
}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);background=ctx.createRadialGradient(W*.55,H*.38,0,W*.5,H*.5,Math.max(W,H)*.8);background.addColorStop(0,'#263238');background.addColorStop(.5,'#171f25');background.addColorStop(1,'#090d13');build()}
function drawPath(path,t){let progress=clamp((t-path.time)/path.duration);if(progress<=0)return;ctx.strokeStyle=path.color;ctx.lineWidth=path.width;ctx.lineCap='round';ctx.globalAlpha=.75;ctx.beginPath();for(let j=0;j<=Math.ceil(progress*70);j++){let v=Math.min(progress,j/70),p=point(path.a,path.b,path.c,path.d,v);if(j===0)ctx.moveTo(p.x*W,p.y*H);else ctx.lineTo(p.x*W,p.y*H)}ctx.stroke();ctx.globalAlpha=1}
function drawLeaf(l,t){let k=clamp((t-l.time)/1.2);if(!k)return;ctx.save();ctx.translate(l.x*W,l.y*H);ctx.rotate(l.angle);let length=l.size*Math.min(W,H)*2*k;let g=ctx.createLinearGradient(0,0,0,-length);g.addColorStop(0,'#1a2828');g.addColorStop(.55,'#495d58');g.addColorStop(1,'#7d8c79');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-length*.4,-length*.35,-length*.18,-length*.83,0,-length);ctx.bezierCurveTo(length*.33,-length*.6,length*.25,-length*.2,0,0);ctx.fill();ctx.strokeStyle='#9ba18a66';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-length);ctx.stroke();ctx.restore()}
// Cada flor se prepara una vez; sus capas se abren de afuera hacia dentro.
function makeFlower(b){const c=document.createElement('canvas');c.width=c.height=640;const p=c.getContext('2d'),colors=palettes[b.palette];seed=b.seed;p.translate(320,320);p.rotate(b.rotation);p.scale(1,.9);const layers=[];for(let ring=0;ring<7;ring++){const layer=document.createElement('canvas');layer.width=layer.height=640;const q=layer.getContext('2d');q.translate(320,320);q.rotate(b.rotation);q.scale(1,.9);let radius=270*(1-ring*.125),count=b.type==='rose'?5+ring:11+ring*2;for(let i=0;i<count;i++){q.save();q.rotate(i*Math.PI*2/count+ring*1.91+between(-.1,.1));let len=radius*between(.92,1.06),w=radius*(b.type==='rose'?.65:.34);let g=q.createLinearGradient(-w,-len*.15,w*.5,-len);g.addColorStop(0,colors[0]);g.addColorStop(.5,colors[1]);g.addColorStop(.86,colors[2]);g.addColorStop(1,colors[3]);q.fillStyle=g;q.beginPath();q.moveTo(-w*.12,-radius*.08);q.bezierCurveTo(-w,-len*.4,-w*1.05,-len*.88,-w*.55,-len*.97);if(b.type==='peony'){q.bezierCurveTo(-w*.3,-len*1.07,-w*.1,-len*.94,0,-len);q.bezierCurveTo(w*.18,-len*1.07,w*.4,-len*.95,w*.56,-len*.98)}else q.bezierCurveTo(-w*.2,-len*1.08,w*.35,-len*1.04,w*.6,-len*.92);q.bezierCurveTo(w*1.05,-len*.67,w*.7,-len*.28,w*.1,-radius*.08);q.closePath();q.fill();q.strokeStyle=colors[3]+'66';q.lineWidth=1;q.stroke();for(let vein=0;vein<6;vein++){let vx=(vein-2.5)*w*.19;q.strokeStyle=vein%2?'#ffffff12':'#15061126';q.lineWidth=.7;q.beginPath();q.moveTo(0,-radius*.1);q.quadraticCurveTo(vx*.6,-len*.6,vx,-len*.94);q.stroke()}q.restore()}// Textura ASCII en cada corona, conservando el color de los pétalos.
const sample=document.createElement('canvas');sample.width=128;sample.height=86;const sc=sample.getContext('2d',{willReadFrequently:true});sc.drawImage(layer,0,0,128,86);const pixels=sc.getImageData(0,0,128,86).data;q.setTransform(1,0,0,1,0,0);q.clearRect(0,0,640,640);q.font='7.5px Courier New,monospace';q.textBaseline='top';const alphabet='.,:;+xXW#@';for(let y=0;y<86;y++)for(let x=0;x<128;x++){let n=(y*128+x)*4;if(pixels[n+3]<60)continue;let r=pixels[n],g=pixels[n+1],b=pixels[n+2],lum=.2126*r+.7152*g+.0722*b;q.fillStyle=`rgb(${r},${g},${b})`;q.fillText(alphabet[Math.min(9,Math.floor(lum/256*10))],x*5,y*640/86)}layers.push(layer)}return layers}
function drawBloom(b,t){let age=t-b.time;if(age<=0)return;const radius=b.size*Math.min(W*1.25,H*.96);if(!b.layers)b.layers=makeFlower(b);ctx.save();ctx.translate(b.x*W,b.y*H);for(let i=0;i<b.layers.length;i++){let k=clamp((age-i*.18)/1.4);if(!k)continue;let ease=1-Math.pow(1-k,3),scale=.16+.84*ease;ctx.globalAlpha=k;ctx.drawImage(b.layers[i],-radius*scale,-radius*scale,radius*2*scale,radius*2*scale)}ctx.restore();ctx.globalAlpha=1}
let settled=false;function frame(now){let t=reduced?30:(now-start)/1000;ctx.fillStyle=background;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d7d1c1';for(let i=0;i<85;i++){let x=((i*7919)%1000)/1000*W,y=((i*3571)%1000)/1000*H;ctx.globalAlpha=.035+(Math.sin(i*3.1+(reduced?0:t*.3))+1)*.035;ctx.fillRect(x,y,i%4? .6:1,i%4?.6:1)}ctx.globalAlpha=1;for(const path of paths)drawPath(path,t);for(const l of leaves)drawLeaf(l,t);for(const b of blooms)drawBloom(b,t);if(t<15&&!reduced)requestAnimationFrame(frame);else settled=true}
addEventListener('resize',()=>{resize();if(settled){settled=false;requestAnimationFrame(frame)}});resize();requestAnimationFrame(frame);
</script></body></html>
