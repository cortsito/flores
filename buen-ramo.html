<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script>if (new URLSearchParams(location.hash.slice(1)).has("m")) document.documentElement.classList.add("gift");</script>
    <title>Buen ramo · Para ti</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #f4efd9;
            font-family: Georgia, serif
        }

        body {
            height: 100svh;
            overflow: hidden
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        header {
            position: fixed;
            top: max(24px, env(safe-area-inset-top));
            left: 32px;
            z-index: 2
        }

        h1 {
            font-size: 25px;
            font-weight: 400;
            margin: 0
        }

        footer {
            position: fixed;
            bottom: calc(46px + env(safe-area-inset-bottom));
            left: 24px;
            right: 24px;
            text-align: center;
            pointer-events: none
        }

        #message {
            max-width: 760px;
            overflow-wrap: anywhere;
            white-space: pre-line;
            font-size: clamp(20px, 3vw, 34px);
            line-height: 1.35;
            font-style: italic;
            margin: 0 auto 12px;
            text-wrap: pretty
        }

        #signature {
            max-width: 650px;
            margin: auto;
            overflow-wrap: anywhere;
            font: 11px/1.6 monospace;
            color: #9d9787;
            letter-spacing: 2px
        }

        .tools {
            position: fixed;
            right: 30px;
            top: 24px;
            display: flex;
            gap: 8px;
            z-index: 3
        }

        button {
            min-height: 44px;
            border: 1px solid #38372f;
            background: #090a08e8;
            color: #c9c5b1;
            border-radius: 24px;
            padding: 10px 15px;
            cursor: pointer;
            font: 11px monospace
        }

        button:hover {
            border-color: #b7a96f;
            color: #fff
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid #d98ca6;
            outline-offset: 3px
        }

        dialog {
            background: #10120e;
            color: #eae5cf;
            border: 1px solid #444634;
            border-radius: 18px;
            padding: 24px;
            width: min(440px, 92vw);
            max-height: 85dvh;
            overflow: auto
        }

        dialog::backdrop {
            background: #000b;
            backdrop-filter: blur(8px)
        }

        label {
            display: block;
            font: 12px/1.5 monospace;
            margin: 18px 0 8px
        }

        input,
        textarea {
            width: 100%;
            background: #000;
            color: #eee8cf;
            border: 1px solid #3b3d30;
            border-radius: 6px;
            padding: 12px;
            font: 16px Georgia
        }

        textarea {
            resize: vertical;
            min-height: 100px
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px
        }

        #hint {
            position: fixed;
            bottom: calc(14px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            font: 10px monospace;
            color: #777164
        }

        .gift header,
        .gift .tools,
        .gift #hint,
        .gift dialog {
            display: none
        }

        .gift footer {
            bottom: calc(24px + env(safe-area-inset-bottom))
        }

        @media(max-width:600px) {
            header {
                top: calc(16px + env(safe-area-inset-top));
                left: 20px
            }

            h1 {
                font-size: 22px
            }

            .tools {
                top: calc(54px + env(safe-area-inset-top));
                left: 16px;
                right: 16px;
                gap: 6px
            }

            .tools button {
                flex: 1;
                padding: 8px 6px;
                font-size: 10px
            }

            footer {
                left: 22px;
                right: 22px;
                bottom: calc(44px + env(safe-area-inset-bottom))
            }

            #message {
                font-size: clamp(19px, 5.5vw, 25px);
                line-height: 1.4
            }

            #signature {
                font-size: 10px;
                letter-spacing: 1.4px
            }

            .gift footer {
                bottom: calc(25px + env(safe-area-inset-bottom))
            }
        }

        @media(max-height:500px) and (min-width:601px) {
            h1 {
                font-size: 20px
            }

            .tools button {
                min-height: 36px
            }

            #message {
                font-size: 20px
            }

            footer,
            .gift footer {
                left: 58%;
                right: 24px;
                bottom: 24%
            }

            #hint {
                width: auto;
                right: 20px
            }
        }
    </style>
</head>

<body>
    <canvas id="scene" aria-label="Ramo de novia con peonías, rosas, eucalipto y pequeñas flores dibujados con caracteres ASCII"></canvas>
    <header>
        <h1>Buen ramo</h1>
    </header>
    <div class="tools"><button id="edit">Escribir dedicatoria</button><button id="share">Copiar enlace</button><button
            id="replay">Volver a florecer</button></div>
    <footer>
        <p id="message">Hay flores que nunca se marchitan.</p>
        <div id="signature">ESTAS SON PARA TI</div>
    </footer>
    <div id="hint">hecho por luis cortés</div>
    <dialog id="editor">
        <form id="form">
            <h2 style="font-weight:400;margin-top:0">Dilo con flores.</h2><label for="text">TU MENSAJE</label><textarea
                id="text" maxlength="140">Hay flores que nunca se marchitan.</textarea><label for="from">UNA FIRMA, UN
                NOMBRE, LO QUE QUIERAS</label><input id="from" maxlength="60" value="Estas son para ti">
            <div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Guardar
                    dedicatoria</button></div>
            <p style="font:10px monospace;color:#999">Guarda tu mensaje y copia el enlace para regalar estas flores.</p>
        </form>
    </dialog>
    <script>
        'use strict';
        const canvas = document.querySelector('#scene'), ctx = canvas.getContext('2d');
        const source = document.createElement('canvas'); source.width = 700; source.height = 900; const p = source.getContext('2d');
        let seed = 21; function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 } function range(a, b) { return a + (b - a) * random() }
        // Fuente procedural: pétalos, vetas y estambres; no necesita archivos externos.
        function leaf(x, y, angle, len, width) { p.save(); p.translate(x, y); p.rotate(angle); let g = p.createLinearGradient(0, 0, 0, -len); g.addColorStop(0, '#17472c'); g.addColorStop(.5, '#629f49'); g.addColorStop(1, '#bed779'); p.fillStyle = g; p.beginPath(); p.moveTo(0, 0); p.bezierCurveTo(-width, -len * .5, -width * .2, -len * .85, 0, -len); p.bezierCurveTo(width * .25, -len * .75, width, -len * .25, 0, 0); p.fill(); p.strokeStyle = '#acbe6680'; p.lineWidth = 1; p.beginPath(); p.moveTo(0, 0); p.lineTo(0, -len); p.stroke(); p.restore() }
        // Peonías: coronas de pétalos redondeados, con bordes ondulados y pliegues.
        function flower(x, y, size, color, rotation) {
            p.save(); p.translate(x, y); p.rotate(rotation); p.scale(1, .88);
            for (let ring = 0; ring < 7; ring++) { let radius = size * (1 - ring * .125), count = 11 + ring * 2; for (let i = 0; i < count; i++) { p.save(); p.rotate(i * Math.PI * 2 / count + ring * 1.74 + range(-.1, .1)); let length = radius * range(.9, 1.08), w = radius * range(.25, .39), base = radius * .17; let g = p.createLinearGradient(-w, 0, w, -length); g.addColorStop(0, color[0]); g.addColorStop(.5, color[1]); g.addColorStop(.88, color[2]); g.addColorStop(1, color[1]); p.fillStyle = g; p.beginPath(); p.moveTo(-w * .18, -base); p.bezierCurveTo(-w * 1.2, -length * .4, -w * 1.15, -length * .83, -w * .65, -length * .95); p.bezierCurveTo(-w * .42, -length * 1.08, -w * .15, -length * .91, 0, -length); p.bezierCurveTo(w * .28, -length * 1.08, w * .4, -length * .94, w * .68, -length * .96); p.bezierCurveTo(w * 1.12, -length * .83, w * .95, -length * .36, w * .18, -base); p.closePath(); p.fill(); p.strokeStyle = color[2] + '88'; p.lineWidth = .9; p.stroke(); for (let j = 0; j < 5; j++) { let xx = (j - 2) * w * .23; p.strokeStyle = j % 2 ? '#ffffff20' : '#4d133b25'; p.lineWidth = .7; p.beginPath(); p.moveTo(0, -base); p.quadraticCurveTo(xx * .6, -length * .65, xx, -length * .94); p.stroke() } p.restore() } }
            p.restore()
        }
        // Cada ramita nace del punto de atado y lleva hojas y flores sobre su curva.
        function stem(x,y,cx,cy,width=2,color='#507d50') {
            p.strokeStyle=color;p.lineWidth=width;p.beginPath();p.moveTo(350,858);p.quadraticCurveTo(cx,cy,x,y);p.stroke();
        }
        function sprig(x,y,cx,cy,kind){
            stem(x,y,cx,cy,1.8,kind==='eucalyptus'?'#597d72':'#69805a');
            function point(t){return {x:(1-t)*(1-t)*350+2*(1-t)*t*cx+t*t*x,y:(1-t)*(1-t)*858+2*(1-t)*t*cy+t*t*y}}
            for(let i=0;i<12;i++){let t=.38+i*.052,at=point(t),next=point(t+.01),angle=Math.atan2(next.y-at.y,next.x-at.x);let side=i%2?1:-1,spread=range(17,42)*(1-t*.55),bx=at.x+Math.cos(angle+side*1.05)*spread,by=at.y+Math.sin(angle+side*1.05)*spread;
                p.strokeStyle='#66865d';p.lineWidth=1;p.beginPath();p.moveTo(at.x,at.y);p.lineTo(bx,by);p.stroke();
                if(kind==='eucalyptus'){p.save();p.translate(bx,by);p.rotate(angle+side*.8);let g=p.createRadialGradient(-3,-3,0,0,0,16);g.addColorStop(0,'#b0c6ad');g.addColorStop(.6,'#658f83');g.addColorStop(1,'#325d50');p.fillStyle=g;p.beginPath();p.ellipse(0,0,range(9,15),range(6,10),0,0,7);p.fill();p.strokeStyle='#d3d9bb66';p.beginPath();p.moveTo(-10,0);p.lineTo(10,0);p.stroke();p.restore()}
                else {let n=kind==='white'?5:3;for(let j=0;j<n;j++)smallFlower(bx+range(-10,10),by+range(-10,10),range(3,6),kind==='white'?['#b6af95','#fff7e2']:['#846a9d','#d8b4e8']);}
            }
        }
        function smallFlower(x,y,r,colors){p.save();p.translate(x,y);p.rotate(range(0,7));for(let i=0;i<5;i++){p.rotate(Math.PI*2/5);let g=p.createLinearGradient(0,0,0,-r);g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);p.fillStyle=g;p.beginPath();p.ellipse(0,-r*.65,r*.48,r*.7,0,0,7);p.fill()}p.fillStyle='#dec377';p.beginPath();p.arc(0,0,r*.23,0,7);p.fill();p.restore()}
        function rose(x,y,r){p.save();p.translate(x,y);for(let ring=0;ring<6;ring++){let rr=r*(1-ring*.145);for(let j=0;j<7;j++){let angle=j*7/7+ring*1.9;p.save();p.rotate(angle);let g=p.createLinearGradient(0,0,0,-rr);g.addColorStop(0,'#90624e');g.addColorStop(.65,'#ecc5a5');g.addColorStop(1,'#fff0d3');p.fillStyle=g;p.beginPath();p.moveTo(-rr*.2,0);p.bezierCurveTo(-rr*.9,-rr*.55,-rr*.7,-rr*1.05,0,-rr);p.bezierCurveTo(rr*.7,-rr*1.05,rr*.8,-rr*.4,rr*.2,0);p.fill();p.restore()}}p.restore()}
        function bouquet() {
            seed=87;p.clearRect(0,0,700,900);
            // Silueta en abanico: follaje y relleno detrás de las flores principales.
            for(const branch of [[95,270,90,550],[590,280,610,530],[128,440,130,650],[570,500,600,700],[235,95,200,410],[470,120,500,390]])sprig(...branch,'eucalyptus');
            for(let i=0;i<23;i++){let angle=range(-1.18,1.18),len=range(125,230);let x=350+Math.sin(angle)*range(100,210),y=range(440,770);stem(x,y,(x+350)/2,650,range(2,4));leaf(x,y,angle,len,range(15,27))}
            for(const branch of [[145,165,120,480],[540,180,580,480],[65,390,120,610],[625,390,590,650],[255,95,220,410],[440,100,480,420],[110,600,160,740],[575,660,560,780]])sprig(...branch,'white');
            for(const branch of [[180,160,150,450],[560,330,600,520],[90,490,110,650],[490,170,550,400]])sprig(...branch,'lavender');
            const blush=['#843c59','#d98ca6','#ffe0e7'],pink=['#792447','#d85f93','#ffbadb'],cream=['#9a7865','#e0c1af','#fff1de'];
            const blooms=[[290,220,107,blush,.3],[452,275,104,cream,.6],[175,375,105,pink,-.2],[355,412,131,blush,.1],[519,465,98,pink,.4],[190,590,100,cream,.2],[330,625,123,pink,-.3],[474,635,102,blush,.6]];
            for(const [x,y] of blooms)stem(x,y,(x+350)/2,690,4);
            rose(178,238,56);rose(520,358,59);rose(105,485,51);rose(415,135,48);rose(556,576,48);
            for(const bloom of blooms)flower(...bloom);
            // Ramitas delanteras: los brotes se conectan al tallo en lugar de flotar.
            for(const branch of [[245,415,175,630],[463,500,550,670],[240,720,200,790]])sprig(...branch,'white');
            for(let i=0;i<9;i++){let x=range(324,376);p.strokeStyle=i%2?'#7f9e59':'#3d6d42';p.lineWidth=3;p.beginPath();p.moveTo(x,780);p.quadraticCurveTo(x+range(-12,12),836,x+range(-16,16),879);p.stroke()}
            // Cinta de seda tenue que reúne el ramo.
            p.strokeStyle='#d6b6aa';p.lineWidth=6;p.beginPath();p.moveTo(324,799);p.quadraticCurveTo(350,810,378,800);p.stroke();p.lineWidth=3;p.beginPath();p.moveTo(352,805);p.bezierCurveTo(285,763,298,848,352,805);p.bezierCurveTo(410,761,405,842,352,805);p.moveTo(352,807);p.quadraticCurveTo(333,844,310,858);p.moveTo(354,807);p.quadraticCurveTo(369,850,394,866);p.stroke();
        }
        bouquet(); let W, H, dpr, cells = [], start = performance.now(); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Densidad: disminuir CELL genera más caracteres y detalle.
        let CELL = 4; const chars = ' .,:;i+tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
        const stars = Array.from({ length: 100 }, () => ({ x: random(), y: random(), r: range(.3, 1), phase: range(0, 7), speed: range(.4, 1) }));
        function resize() { W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2); canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const gift = document.documentElement.classList.contains('gift'), wide = W > 600 && H < 500; const bottom = document.querySelector('footer').getBoundingClientRect().top - 12; const controls = document.querySelector('.tools').getBoundingClientRect(); const upper = gift ? Math.max(12, H * .025) : controls.bottom + 18; const available = Math.max(60, bottom - upper); let height = Math.min(available, 1100), width = height * 700 / 900; const maxWidth = wide ? W * .52 : W * .98; if (width > maxWidth) { width = maxWidth; height = width * 900 / 700 } let left = wide ? (W * .54 - width) / 2 : (W - width) / 2, top = upper + Math.max(0, (available - height) * .45); CELL = W <= 600 ? 2 : 2.8; const sample = document.createElement('canvas'); sample.width = Math.ceil(width / CELL); sample.height = Math.ceil(height / (CELL * 1.55)); const s = sample.getContext('2d', { willReadFrequently: true }); s.drawImage(source, 0, 0, sample.width, sample.height); const data = s.getImageData(0, 0, sample.width, sample.height).data; cells = []; for (let y = 0; y < sample.height; y++)for (let x = 0; x < sample.width; x++) { let i = (y * sample.width + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3]; let lum = .2126 * r + .7152 * g + .0722 * b; if (a < 65 || lum < 15) continue; cells.push({ x: left + x * CELL, y: top + y * CELL * 1.55, color: `rgb(${r},${g},${b})`, char: chars[Math.min(chars.length - 1, Math.floor(lum / 255 * (chars.length - 1)))], delay: y / sample.height, noise: random() }) } }
        function frame(now) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); let t = (now - start) / 1000; for (const s of stars) { ctx.globalAlpha = reduce ? .3 : .15 + (Math.sin(now * .0006 * s.speed + s.phase) + 1) * .2; ctx.fillStyle = '#c4c5b0'; ctx.beginPath(); ctx.arc(s.x * W, (s.y * H + (reduce ? 0 : t * s.speed * 2)) % H, s.r, 0, 7); ctx.fill() } ctx.font = `${CELL * 1.5}px 'Courier New',monospace`; ctx.textBaseline = 'top'; for (const c of cells) { let age = reduce ? 2 : t - c.delay * 3.3 - c.noise * .3; if (age < 0) continue; ctx.globalAlpha = Math.min(1, age * 1.8); ctx.fillStyle = c.color; ctx.fillText(age < .45 ? chars[Math.floor((c.noise * 73 + t * 18) % chars.length)] : c.char, c.x, c.y) } ctx.globalAlpha = 1; requestAnimationFrame(frame) }
        addEventListener('resize', resize); if (window.visualViewport) visualViewport.addEventListener('resize', resize); new ResizeObserver(() => requestAnimationFrame(resize)).observe(document.querySelector('footer')); resize(); requestAnimationFrame(frame); document.querySelector('#replay').onclick = () => start = performance.now();
        const editor = document.querySelector('#editor'), text = document.querySelector('#text'), from = document.querySelector('#from'); function apply() { document.querySelector('#message').textContent = text.value; document.querySelector('#signature').textContent = from.value.toUpperCase(); document.querySelector('#signature').hidden = !from.value.trim(); requestAnimationFrame(resize) }
        // El fragmento de la URL contiene la dedicatoria; GitHub Pages sirve el mismo HTML.
        function readLink() { const params = new URLSearchParams(location.hash.slice(1)); document.documentElement.classList.toggle('gift', params.has('m')); if (!params.has('m')) { requestAnimationFrame(resize); return false; } text.value = (params.get('m') || '').slice(0, 140); from.value = (params.get('f') || '').slice(0, 60); apply(); return true }
        if (!readLink()) { try { const saved = JSON.parse(localStorage.getItem('flores-dedication')); if (saved && typeof saved.text === 'string' && typeof saved.from === 'string') { text.value = saved.text.slice(0, 140); from.value = saved.from.slice(0, 60); apply() } } catch { } }
        addEventListener('hashchange', readLink);
        function link() { const url = new URL(location.href); url.hash = new URLSearchParams({ m: text.value, f: from.value }).toString(); return url.href }
        document.querySelector('#edit').onclick = () => editor.showModal(); document.querySelector('#cancel').onclick = () => editor.close(); document.querySelector('#form').onsubmit = e => { e.preventDefault(); apply(); try { localStorage.setItem('flores-dedication', JSON.stringify({ text: text.value, from: from.value })) } catch { } editor.close() };
        const share = document.querySelector('#share'); share.onclick = async () => { const url = link(); if (location.protocol === 'file:') { window.alert('Cuando publiques esta página en GitHub Pages, este botón copiará tu enlace compartible. Por ahora puedes editar y ver tu dedicatoria aquí.'); return } try { await navigator.clipboard.writeText(url); share.textContent = 'Enlace copiado'; setTimeout(() => share.textContent = 'Copiar enlace', 2200) } catch { window.prompt('Copia este enlace para compartir tu dedicatoria:', url) } };
    </script>
</body>

</html>
