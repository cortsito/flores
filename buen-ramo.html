<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Buen ramo · Para ti</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #f4efd9;
            font-family: Georgia, serif
        }

        body {
            height: 100svh;
            overflow: hidden
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        header {
            position: fixed;
            top: max(24px, env(safe-area-inset-top));
            left: 32px;
            z-index: 2
        }

        h1 {
            font-size: 25px;
            font-weight: 400;
            margin: 0
        }

        footer {
            position: fixed;
            bottom: calc(46px + env(safe-area-inset-bottom));
            left: 24px;
            right: 24px;
            text-align: center;
            pointer-events: none
        }

        #message {
            max-width: 760px;
            overflow-wrap: anywhere;
            white-space: pre-line;
            font-size: clamp(20px, 3vw, 34px);
            line-height: 1.35;
            font-style: italic;
            margin: 0 auto 12px;
            text-wrap: pretty
        }

        #signature {
            max-width: 650px;
            margin: auto;
            overflow-wrap: anywhere;
            font: 11px/1.6 monospace;
            color: #9d9787;
            letter-spacing: 2px
        }

        .tools {
            position: fixed;
            right: 30px;
            top: 24px;
            display: flex;
            gap: 8px;
            z-index: 3
        }

        button {
            min-height: 44px;
            border: 1px solid #38372f;
            background: #090a08e8;
            color: #c9c5b1;
            border-radius: 24px;
            padding: 10px 15px;
            cursor: pointer;
            font: 11px monospace
        }

        button:hover {
            border-color: #b7a96f;
            color: #fff
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid #d98ca6;
            outline-offset: 3px
        }

        dialog {
            background: #10120e;
            color: #eae5cf;
            border: 1px solid #444634;
            border-radius: 18px;
            padding: 24px;
            width: min(440px, 92vw);
            max-height: 85dvh;
            overflow: auto
        }

        dialog::backdrop {
            background: #000b;
            backdrop-filter: blur(8px)
        }

        label {
            display: block;
            font: 12px/1.5 monospace;
            margin: 18px 0 8px
        }

        input,
        textarea {
            width: 100%;
            background: #000;
            color: #eee8cf;
            border: 1px solid #3b3d30;
            border-radius: 6px;
            padding: 12px;
            font: 16px Georgia
        }

        textarea {
            resize: vertical;
            min-height: 100px
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px
        }

        #hint {
            position: fixed;
            bottom: calc(14px + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            font: 10px monospace;
            color: #777164
        }

        .gift header,
        .gift .tools,
        .gift #hint,
        .gift dialog {
            display: none
        }

        .gift footer {
            bottom: calc(24px + env(safe-area-inset-bottom))
        }

        @media(max-width:600px) {
            header {
                top: calc(16px + env(safe-area-inset-top));
                left: 20px
            }

            h1 {
                font-size: 22px
            }

            .tools {
                top: calc(54px + env(safe-area-inset-top));
                left: 16px;
                right: 16px;
                gap: 6px
            }

            .tools button {
                flex: 1;
                padding: 8px 6px;
                font-size: 10px
            }

            footer {
                left: 22px;
                right: 22px;
                bottom: calc(44px + env(safe-area-inset-bottom))
            }

            #message {
                font-size: clamp(19px, 5.5vw, 25px);
                line-height: 1.4
            }

            #signature {
                font-size: 10px;
                letter-spacing: 1.4px
            }

            .gift footer {
                bottom: calc(25px + env(safe-area-inset-bottom))
            }
        }

        @media(max-height:500px) and (min-width:601px) {
            h1 {
                font-size: 20px
            }

            .tools button {
                min-height: 36px
            }

            #message {
                font-size: 20px
            }

            footer,
            .gift footer {
                left: 58%;
                right: 24px;
                bottom: 24%
            }

            #hint {
                width: auto;
                right: 20px
            }
        }
        footer { opacity: 0; }
    </style>
</head>

<body>
    <canvas id="scene" aria-label="Animación ASCII de una persona que encuentra un ramo y lo entrega hacia la cámara"></canvas>

    <footer>
        <p id="message">para ti</p>
    </footer>
    <div id="hint">hecho por luis cortés</div>
    <script>
        'use strict';
        const canvas = document.querySelector('#scene'), ctx = canvas.getContext('2d');

        // Cada ramita nace del punto de atado y lleva hojas y flores sobre su curva.

            p.strokeStyle=color;p.lineWidth=width;p.beginPath();p.moveTo(350,858);p.quadraticCurveTo(cx,cy,x,y);p.stroke();
        }
        function sprig(x,y,cx,cy,kind){
            stem(x,y,cx,cy,1.8,kind==='eucalyptus'?'#597d72':'#69805a');
            function point(t){return {x:(1-t)*(1-t)*350+2*(1-t)*t*cx+t*t*x,y:(1-t)*(1-t)*858+2*(1-t)*t*cy+t*t*y}}
            for(let i=0;i<12;i++){let t=.38+i*.052,at=point(t),next=point(t+.01),angle=Math.atan2(next.y-at.y,next.x-at.x);let side=i%2?1:-1,spread=range(17,42)*(1-t*.55),bx=at.x+Math.cos(angle+side*1.05)*spread,by=at.y+Math.sin(angle+side*1.05)*spread;

                else {let n=kind==='white'?5:3;for(let j=0;j<n;j++)smallFlower(bx+range(-10,10),by+range(-10,10),range(3,6),kind==='white'?['#b6af95','#fff7e2']:['#846a9d','#d8b4e8']);}
            }
        }
        function smallFlower(x,y,r,colors){p.save();p.translate(x,y);p.rotate(range(0,7));for(let i=0;i<5;i++){p.rotate(Math.PI*2/5);let g=p.createLinearGradient(0,0,0,-r);g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);p.fillStyle=g;p.beginPath();p.ellipse(0,-r*.65,r*.48,r*.7,0,0,7);p.fill()}p.fillStyle='#dec377';p.beginPath();p.arc(0,0,r*.23,0,7);p.fill();p.restore()}

            for(const branch of [[145,165,120,480],[540,180,580,480],[65,390,120,610],[625,390,590,650],[255,95,220,410],[440,100,480,420],[110,600,160,740],[575,660,560,780]])sprig(...branch,'white');
            for(const branch of [[180,160,150,450],[560,330,600,520],[90,490,110,650],[490,170,550,400]])sprig(...branch,'lavender');
            const blush=['#843c59','#d98ca6','#ffe0e7'],pink=['#792447','#d85f93','#ffbadb'],cream=['#9a7865','#e0c1af','#fff1de'];
            const blooms=[[290,220,107,blush,.3],[452,275,104,cream,.6],[175,375,105,pink,-.2],[355,412,131,blush,.1],[519,465,98,pink,.4],[190,590,100,cream,.2],[330,625,123,pink,-.3],[474,635,102,blush,.6]];
            for(const [x,y] of blooms)stem(x,y,(x+350)/2,690,4);
            rose(178,238,56);rose(520,358,59);rose(105,485,51);rose(415,135,48);rose(556,576,48);

            for(const branch of [[245,415,175,630],[463,500,550,670],[240,720,200,790]])sprig(...branch,'white');
            for(let i=0;i<9;i++){let x=range(324,376);p.strokeStyle=i%2?'#7f9e59':'#3d6d42';p.lineWidth=3;p.beginPath();p.moveTo(x,780);p.quadraticCurveTo(x+range(-12,12),836,x+range(-16,16),879);p.stroke()}
            // Cinta de seda tenue que reúne el ramo.
            p.strokeStyle='#d6b6aa';p.lineWidth=6;p.beginPath();p.moveTo(324,799);p.quadraticCurveTo(350,810,378,800);p.stroke();p.lineWidth=3;p.beginPath();p.moveTo(352,805);p.bezierCurveTo(285,763,298,848,352,805);p.bezierCurveTo(410,761,405,842,352,805);p.moveTo(352,807);p.quadraticCurveTo(333,844,310,858);p.moveTo(354,807);p.quadraticCurveTo(369,850,394,866);p.stroke();
        }
        bouquet(); let sceneLayout; let W, H, dpr, cells = [], start = performance.now(); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

        let CELL = 4; const chars = ' .,:;i+tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
        const stars = Array.from({ length: 100 }, () => ({ x: random(), y: random(), r: range(.3, 1), phase: range(0, 7), speed: range(.4, 1) }));
        function resize() { previousFrame = -1; W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2); canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const wide = W > 600 && H < 500; const bottom = document.querySelector('footer').getBoundingClientRect().top - 12; const upper = Math.max(12, H * .025); const available = Math.max(60, bottom - upper); let height = Math.min(available, 1100), width = height * 700 / 900; const maxWidth = wide ? W * .52 : W * .98; if (width > maxWidth) { width = maxWidth; height = width * 900 / 700 } let left = wide ? (W * .54 - width) / 2 : (W - width) / 2, top = upper + Math.max(0, (available - height) * .45); sceneLayout = {left,top,width,height}; CELL = W <= 600 ? 2 : 2.8; const sample = document.createElement('canvas'); sample.width = Math.ceil(width / CELL); sample.height = Math.ceil(height / (CELL * 1.55)); const s = sample.getContext('2d', { willReadFrequently: true }); s.drawImage(source, 0, 0, sample.width, sample.height); const data = s.getImageData(0, 0, sample.width, sample.height).data; cells = []; for (let y = 0; y < sample.height; y++)for (let x = 0; x < sample.width; x++) { let i = (y * sample.width + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3]; let lum = .2126 * r + .7152 * g + .0722 * b; if (a < 65 || lum < 15) continue; cells.push({ x: left + x * CELL, y: top + y * CELL * 1.55, color: `rgb(${r},${g},${b})`, char: chars[Math.min(chars.length - 1, Math.floor(lum / 255 * (chars.length - 1)))], delay: y / sample.height, noise: random() }) } }
        // Película procedural a 24 fotogramas por segundo. Tiempos en segundos.
        const film=document.createElement('canvas');film.width=700;film.height=900;
        const ink=film.getContext('2d'),grid=document.createElement('canvas'),pixels=grid.getContext('2d',{willReadFrequently:true});
        const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t;
        const caption=document.querySelector('footer');let previousFrame=-1;
        function line(points,color,width){ink.strokeStyle=color;ink.lineWidth=width;ink.lineCap='round';ink.lineJoin='round';ink.beginPath();points.forEach(([x,y],i)=>i?ink.lineTo(x,y):ink.moveTo(x,y));ink.stroke()}
        function oval(x,y,rx,ry,color){ink.fillStyle=color;ink.beginPath();ink.ellipse(x,y,rx,ry,0,0,Math.PI*2);ink.fill()}
        function hand(x,y,scale,alpha=1){ink.save();ink.globalAlpha=alpha;ink.translate(x,y);ink.scale(scale,scale);line([[4,155],[0,45]],'#c08b74',39);line([[-7,147],[-12,50]],'#edb79a',22);oval(0,21,27,37,'#efb99c');for(let i=0;i<4;i++)line([[-17+i*11,22],[-21+i*12,-12-i*2],[-14+i*11,-24-i*2]],i%2?'#f5c6a9':'#e5aa8b',10);line([[19,39],[34,15],[24,0]],'#ffd0af',13);line([[-15,39],[10,42]],'#bd826d',2);ink.restore()}
        function person(x,y,walk,bend,turn,reach,alpha,t){

            line([[-24+stride*30,0],[-7+stride*30,0]],'#e8ddc5',15);line([[20-stride*30,0],[37-stride*30,0]],'#e8ddc5',15);
            ink.save();ink.translate(0,-91-bob);ink.rotate(bend*.85);let broad=mix(24,36,turn);

            line([[-broad,-83],[-38-stride*17,-47],[-27-stride*24,-14]],'#a5b8a3',17);oval(-27-stride*24,-14,9,11,'#eabc9e');

            line([[0,-107],[0,-119]],'#d39f84',18);oval(0,-145,30,36,'#efb99c');oval(-3,-166,31,20,'#483b38');oval(-22,-147,10,22,'#483b38');
            if(turn>.25){oval(-10,-147,2.7,3.3,'#362c2c');oval(12,-147,2.7,3.3,'#362c2c');line([[-5,-132],[1,-129],[8,-133]],'#9f6557',2)}else{oval(21,-148,3,3,'#362c2c');oval(29,-139,6,4,'#efb99c')}
            ink.restore();ink.restore()
        }
        function drawFilm(t){
            ink.clearRect(0,0,700,900);

            for(let i=0;i<16;i++){let x=i*47;line([[x,775],[x-5,755],[x+2,765],[x+8,748]],'#3d5844',2)}ink.globalAlpha=1;

            requestAnimationFrame(frame);const t=reduce?15:Math.min(15,(now-start)/1000),index=Math.floor(t*24);if(index===previousFrame)return;previousFrame=index;

        }

        if (window.visualViewport) visualViewport.addEventListener('resize', resize);

    </script>
</body>
</html>
