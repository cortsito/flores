<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>El encuentro · Una escena ASCII</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#ddd;overflow:hidden;font-family:monospace}canvas{display:block;width:100%;height:100dvh}header{position:fixed;top:28px;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:#aaa;pointer-events:none}#caption{position:fixed;bottom:8vh;left:24px;right:24px;text-align:center;font-family:Georgia,serif;font-size:clamp(20px,3vw,32px);font-style:italic;opacity:0;transition:opacity 2s}button{position:fixed;bottom:24px;right:5vw;background:transparent;border:1px solid #444;border-radius:30px;color:#aaa;padding:12px 18px;cursor:pointer;font:10px monospace}button:hover{border-color:#ddd;color:#fff}@media(max-width:600px){header{font-size:8px;letter-spacing:2px;top:22px}#caption{bottom:13vh}}</style></head><body><canvas aria-label="Animación ASCII de una persona caminando por una calle nocturna hasta encontrarse con otra"></canvas><header><span>EL ENCUENTRO</span><span>ESTUDIO EN MOVIMIENTO / 002</span></header><p id="caption">A veces, llegar es encontrar a alguien.</p><button type="button">Volver a empezar</button><script>

const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scene=document.createElement('canvas'),s=scene.getContext('2d'),back=document.createElement('canvas'),b=back.getContext('2d');scene.width=back.width=1200;scene.height=back.height=760;

function background(){seed=71;let g=b.createLinearGradient(0,0,0,760);g.addColorStop(0,'#080808');g.addColorStop(.56,'#333');g.addColorStop(1,'#090909');b.fillStyle=g;b.fillRect(0,0,1200,760);for(let i=0;i<90;i++){b.fillStyle=i%7?'#444':'#999';b.fillRect(range(0,1200),range(25,310),1,1)}
for(let i=0;i<32;i++)tree(i*42+range(-20,20),435,range(90,230));
// Une rue en perspective, puis un trottoir horizontal pour rendre la marche lisible.
b.fillStyle='#1e1e1e';b.beginPath();b.moveTo(555,405);b.lineTo(660,405);b.lineTo(1200,760);b.lineTo(0,760);b.closePath();b.fill();line(b,[[0,690],[558,405]],'#666',2);line(b,[[1200,685],[656,405]],'#666',2);
for(let i=0;i<11;i++){let y=440+i*i*2.7;line(b,[[595-(y-405)*.025,y],[598-(y-405)*.025,y+Math.max(3,(y-405)*.06)]],'#777',2)}

}
function person(x,ground,phase,walking,flip,gesture){s.save();s.translate(x,ground);s.scale(flip,1);const stride=Math.sin(phase)*walking,bob=Math.abs(Math.cos(phase))*walking*2,hip=-47-bob,shoulder=-91-bob;
// Ombre, manteau, tête et membres sont tous convertis en caractères.
s.fillStyle='#777';s.globalAlpha=.2;s.beginPath();s.ellipse(0,2,29,5,0,0,7);s.fill();s.globalAlpha=1;
line(s,[[-5,hip],[-8+stride*12,-24],[stride*21,0]],'#c3c3c3',7);line(s,[[5,hip],[8-stride*12,-24],[-stride*21,0]],'#999',7);line(s,[[stride*21-4,0],[stride*21+8,0]],'#eee',4);line(s,[[-stride*21-4,0],[-stride*21+8,0]],'#aaa',4);
s.fillStyle='#a0a0a0';s.beginPath();s.moveTo(-12,shoulder);s.quadraticCurveTo(0,shoulder-6,12,shoulder);s.lineTo(17,hip+8);s.lineTo(-15,hip+8);s.closePath();s.fill();line(s,[[2,shoulder+5],[4,hip+4]],'#ddd',1.4);

line(s,[[11,shoulder+4],[16+stride*9+gesture*5,-68-gesture*8],[10+stride*16+gesture*20,-48-gesture*22]],'#d5d5d5',5);

function draw(t){s.drawImage(back,0,0);const progress=clamp((t-1)/10),ease=progress<.87?progress:(.87+.13*(1-Math.pow(1-(progress-.87)/.13,2)));const moving=t>1&&progress<1?Math.min(1,(1-progress)*12):0,firstX=100+ease*660;person(firstX,596,t*7,moving,1,clamp((t-11.5)/1.5)*.65);person(830,596,0,0,-1,clamp((t-10)/1.8)*.65);
// Le paysage entier, personnages compris, passe dans une seule grille ASCII.
sam.drawImage(scene,0,0,cols,rows);const pixels=sam.getImageData(0,0,cols,rows).data;ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);const ramp=' .,:;i!+tfjxX#MW@',width=Math.min(W,H*1200/760),height=width*760/1200,left=(W-width)/2,top=(H-height)/2;ctx.font=`${step*1.65}px 'Courier New',monospace`;ctx.textBaseline='top';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=(y*cols+x)*4,lum=pixels[n],char=ramp[Math.min(ramp.length-1,Math.floor(Math.pow(lum/255,.72)*(ramp.length-1)))];if(char===' ')continue;let value=Math.min(255,lum*1.3+17)|0;ctx.fillStyle=`rgb(${value},${value},${value})`;ctx.fillText(char,left+x*step,top+y*row)}document.querySelector('#caption').style.opacity=t>12?'1':'0'}
function frame(now){if(now-last<65&&!reduced){raf=requestAnimationFrame(frame);return}last=now;let t=reduced?16:(now-started)/1000;draw(t);if(t<15&&!reduced)raf=requestAnimationFrame(frame);else ended=true}
function resize(){cancelAnimationFrame(raf);W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);let width=Math.min(W,H*1200/760),height=width*760/1200;step=W<600?2.4:3.6;row=step*1.65;cols=Math.ceil(width/step);rows=Math.ceil(height/row);sample.width=cols;sample.height=rows;raf=requestAnimationFrame(frame)}background();addEventListener('resize',resize);document.querySelector('button').onclick=()=>{started=performance.now();ended=false;cancelAnimationFrame(raf);document.querySelector('#caption').style.opacity=0;raf=requestAnimationFrame(frame)};resize();
