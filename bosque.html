*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#ededed}body{font-family:Arial,Helvetica,sans-serif}main{position:relative;min-height:100svh;isolation:isolate;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}main:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 47%,#0005 0%,transparent 52%),linear-gradient(#0004,transparent 20%,transparent 75%,#0009)}header{position:absolute;top:32px;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:center;font:10px/1.5 monospace;letter-spacing:2px}header strong{font-size:15px;letter-spacing:5px}header span{color:#aaa}.hero{position:absolute;left:16px;right:16px;top:45%;transform:translateY(-50%);text-align:center}.eyebrow{font:10px monospace;letter-spacing:5px;color:#aaa;margin-bottom:22px}h1{font-size:clamp(65px,16.5vw,260px);font-weight:400;letter-spacing:-.075em;line-height:.84;margin:0;padding-right:.075em;text-shadow:0 4px 45px #0009}.description{font:12px/1.8 monospace;letter-spacing:.5px;color:#bbb;margin:30px auto 0;max-width:340px}.bottom{position:absolute;bottom:30px;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:flex-end;color:#999;font:9px/1.7 monospace;letter-spacing:1.5px}.coordinate{text-align:right}.line{width:35px;height:1px;background:#777;margin-bottom:12px}@media(max-width:600px){header{top:24px}header span{font-size:8px;letter-spacing:1px}.eyebrow{font-size:8px;letter-spacing:3px}h1{font-size:20vw}.description{font-size:10px;max-width:260px}.bottom{font-size:8px;bottom:24px}.hero{top:46%}}
</style></head><body><main><canvas aria-label="Bosque monocromático dibujado completamente en caracteres ASCII"></canvas><header><strong>UMBRAL</strong><span>ESTUDIO EXPERIMENTAL / 001</span></header><section class="hero"><p class="eyebrow">ENTRE LO VISIBLE Y LO INVISIBLE</p><h1>UMBRAL</h1><p class="description">Hay lugares que no se encuentran.<br>Se sienten.</p></section><div class="bottom"><div><div class="line"></div>UN PAISAJE HECHO DE CARACTERES</div><div class="coordinate">LUZ / SOMBRA / SILENCIO<br>00 — EL BOSQUE</div></div></main><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),source=document.createElement('canvas'),s=source.getContext('2d');let W,H,seed=83,grid=[],raf,started=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,random=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),range=(a,b)=>a+(b-a)*random();
function branch(x,y,len,angle,width,depth,light){let ex=x+Math.sin(angle)*len,ey=y-Math.cos(angle)*len;s.strokeStyle=`rgb(${light},${light},${light})`;s.lineWidth=width;s.lineCap='round';s.beginPath();s.moveTo(x,y);s.quadraticCurveTo(x+Math.sin(angle+.13)*len*.5,y-Math.cos(angle)*len*.5,ex,ey);s.stroke();if(depth<=0)return;branch(ex,ey,len*range(.59,.79),angle+range(-.19,.19),width*.67,depth-1,light);if(random()>.12)branch(ex,ey,len*range(.4,.69),angle+range(.3,.85)*(random()>.5?1:-1),width*.54,depth-1,light)}
function pine(x,ground,height,width,light){s.strokeStyle=`rgb(${light},${light},${light})`;s.lineWidth=Math.max(1,width*.04);s.beginPath();s.moveTo(x,ground);s.lineTo(x,ground-height);s.stroke();for(let i=0;i<45;i++){let t=i/45,y=ground-height+t*height*.94,extent=width*(.05+t*.48);for(let side of [-1,1]){s.lineWidth=range(1,3);s.beginPath();s.moveTo(x,y-range(1,8));s.lineTo(x+side*extent*range(.6,1),y+height*range(.02,.06));s.stroke();for(let j=0;j<3;j++){let a=range(.25,.95);s.beginPath();s.moveTo(x+side*extent*a,y+height*.025*a);s.lineTo(x+side*(extent*a+range(3,10)),y+range(7,18));s.stroke()}}}}
function generate(){seed=83;source.width=W;source.height=H;s.fillStyle='#080808';s.fillRect(0,0,W,H);let haze=s.createRadialGradient(W*.51,H*.43,0,W*.51,H*.5,W*.75);haze.addColorStop(0,'#434343');haze.addColorStop(.5,'#222');haze.addColorStop(1,'#090909');s.fillStyle=haze;s.fillRect(0,0,W,H);
// Trois plans de conifères : densité, hauteur et contraste augmentent vers l'avant.
for(let layer=0;layer<3;layer++){let n=Math.ceil(W/(layer===0?28:65));for(let i=0;i<n;i++){let x=(i+.3)*W/n+range(-25,25),ground=H*(.82+layer*.075),height=H*range(.28,.72)*(1+layer*.12);pine(x,ground,height,height*range(.15,.28),Math.floor(range(30,48)+layer*27))}}
// Deux arbres de premier plan encadrent le centre sans le fermer.
for(let side of [-1,1]){let x=W*(side<0?.065:.94);branch(x,H*1.08,H*.37,side*-.12,Math.max(7,W*.012),7,145)}
// Sol et sous-bois, eux aussi convertis en glyphes.
for(let i=0;i<W*.55;i++){let x=range(0,W),y=range(H*.86,H*1.04);s.strokeStyle=`rgb(${range(35,95)|0},${range(35,95)|0},${range(35,95)|0})`;s.lineWidth=range(.6,1.5);s.beginPath();s.moveTo(x,y);s.lineTo(x+range(-14,14),y-range(6,45));s.stroke()}
const step=W<600?4.2:5.6,row=step*1.65,small=document.createElement('canvas');small.width=Math.ceil(W/step);small.height=Math.ceil(H/row);let p=small.getContext('2d',{willReadFrequently:true});p.drawImage(source,0,0,small.width,small.height);let data=p.getImageData(0,0,small.width,small.height).data,ramp=' .,:;i!+tfrxX#MW@';grid=[];for(let y=0;y<small.height;y++)for(let x=0;x<small.width;x++){let n=(y*small.width+x)*4,lum=.2126*data[n]+.7152*data[n+1]+.0722*data[n+2];let density=Math.pow(lum/180,.83);let char=ramp[Math.min(ramp.length-1,Math.floor(density*(ramp.length-1)))];if(char===' ')continue;grid.push({x:x*step,y:y*row,char,brightness:Math.min(205,lum*1.4+12),phase:range(0,7)})}ctx.font=`${step*1.65}px 'Courier New',monospace`;ctx.textBaseline='top'}
function resize(){cancelAnimationFrame(raf);W=innerWidth;H=innerHeight;let dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);generate();raf=requestAnimationFrame(frame)}
let last=0;function frame(now){if(!reduced&&now-last<85){raf=requestAnimationFrame(frame);return}last=now;let t=(now-started)/1000;ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);for(let c of grid){let breathing=reduced?1:.94+.06*Math.sin(t*.3+c.phase),light=c.brightness*breathing|0;ctx.fillStyle=`rgb(${light},${light},${light})`;ctx.fillText(c.char,c.x,c.y)}if(!reduced)raf=requestAnimationFrame(frame)}addEventListener('resize',resize);resize();
</script></body></html>
