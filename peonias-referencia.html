<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peonías · Reconstrucción procedural</title><style>*{box-sizing:border-box}html,body{margin:0;background:#090909;color:#efe5e6;font-family:monospace}main{max-width:1000px;margin:auto;padding:28px 22px;text-align:center}h1{font:400 30px Georgia;margin:10px 0}p{font-size:11px;line-height:1.8;color:#aaa1a6;margin:0 auto 20px;max-width:620px}.frame{border:1px solid #ded5d7;margin:auto;width:min(100%,650px);padding:10px;transition:background .2s;background:#000}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}button{margin:18px 3px 0;padding:11px 15px;background:#191619;color:#eadce2;border:1px solid #61505c;border-radius:4px;font:11px monospace;cursor:pointer}button:hover{border-color:#efbdd1}.note{margin-top:16px;font-size:10px;color:#877c83}</style></head><body><main><h1>Peonías rosa pálido.</h1><p>Reconstrucción procedural guiada por tu referencia: ramo inclinado, flores abombadas y pétalos grandes con bordes rosa intenso. Sin usar la foto como textura.</p><div class="frame"><canvas width="384" height="430" aria-label="Ramo pixel art de peonías rosa pálido, reconstruido mediante pétalos programados"></canvas></div><button id="background">Fondo marfil</button><button id="detail">Ver píxeles más grandes</button><div class="note">384 × 430 · Paleta limitada · Pétalos dibujados individualmente</div></main><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),art=document.createElement('canvas'),p=art.getContext('2d');art.width=384;art.height=430;let seed=194;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),range=(a,b)=>a+(b-a)*rand(),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// Paleta tomada como guía visual, nunca muestreada desde una fotografía.
const palette=['#85415e','#a95079','#bc608e','#d478a1','#df91b3','#e9aac5','#efbfd2','#f4cedc','#f7dce4','#fae6e9','#fff1ed'];
const mask=document.createElement('canvas');mask.width=mask.height=180;const m=mask.getContext('2d',{willReadFrequently:true});
function px(x,y,c){p.fillStyle=c;p.fillRect(Math.round(x),Math.round(y),1,1)}
function stem(ax,ay,bx,by,width){let len=Math.hypot(bx-ax,by-ay),colors=['#455c34','#65783e','#8b9b57','#b3b87a'];for(let i=0;i<len;i++){let t=i/len,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;for(let j=-width;j<=width;j++)px(x+j,y,colors[clamp(Math.floor((j/width+1)*1.8),0,3)])}}
// Un pétalo es una silueta propia. La máscara solo define cobertura; cada píxel recibe un tono discreto.
function petal(cx,cy,w,h,angle,light,phase,fold){m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,180,180);m.save();m.translate(90,90);m.rotate(angle);m.fillStyle='#fff';m.beginPath();m.moveTo(-w*.23,h*.42);m.bezierCurveTo(-w*.75,h*.12,-w*.64,-h*.25,-w*.48,-h*.42);
// Bord ondulé plutôt qu'un bout pointu : plusieurs plis irréguliers.
for(let i=0;i<=12;i++){let x=-w*.48+i*w*.08,y=-h*.42-Math.sin(i/12*Math.PI)*h*.09+Math.sin(i*2.1+phase)*h*.035;m.lineTo(x,y)}
m.bezierCurveTo(w*.68,-h*.16,w*.62,h*.18,w*.19,h*.44);m.quadraticCurveTo(0,h*.56,-w*.23,h*.42);m.closePath();m.fill();m.restore();const data=m.getImageData(0,0,180,180).data,cs=Math.cos(angle),sn=Math.sin(angle),bound=Math.ceil(Math.max(w,h)*.85+3);for(let yy=-bound;yy<=bound;yy++)for(let xx=-bound;xx<=bound;xx++){let mx=xx+90,my=yy+90;if(mx<0||my<0||mx>=180||my>=180||data[(my*180+mx)*4+3]<128)continue;let u=xx*cs+yy*sn,v=-xx*sn+yy*cs,edgeY=-h*.42-Math.sin((u/w+.48)/.96*Math.PI)*h*.09;let score=light-.45-v/h*2.05-u/w*.85+Math.cos(u/w*8+v/h*3+phase)*.36;
if(v<edgeY+h*.07)score-=fold?3.2:1.5;if(v>h*.26)score-=1.2;if(Math.abs(u/w-.16*Math.sin(v/h*5+phase))<.024)score-=.8;const grain=Math.sin((cx+xx)*91+(cy+yy)*37+phase)*.13;let index=clamp(Math.floor(score+grain),0,10);px(cx+xx,cy+yy,palette[index])}}
function peony(cx,cy,r,closed,rotation,tone=0){
// Ombre sphérique irrégulière : elle évite les trous entre les pétales et conserve une masse arrondie.
for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){let q=x*x/(r*r)+y*y/(r*r*.83);if(q>1)continue;let idx=clamp(Math.floor(5+tone-x/r*.5-y/r*1.1-(q>.8?1:0)),0,10);px(cx+x,cy+y,palette[idx])}
// Les anneaux arrière sont moins nombreux et plus larges que dans la première version.
for(let ring=0;ring<4;ring++){let rr=r*(.74-ring*.17),count=closed?8+ring:11+ring*2;for(let i=0;i<count;i++){let a=i*Math.PI*2/count+rotation+ring*1.71,xx=Math.cos(a)*rr,yy=Math.sin(a)*rr*.8;petal(cx+xx,cy+yy,r*(ring===0?.62:.47),r*(ring===0?.65:.48),a+Math.PI/2+range(-.17,.17),6.7+tone-Math.sin(a)*.8,range(0,7),i%3!==0)}}
// Grandes coques au premier plan : fleur en coupe, et non rosace plate.
petal(cx-r*.52,cy+r*.12,r*.62,r*.98,-.48,7.3+tone,1.2,true);
petal(cx+r*.49,cy+r*.13,r*.65,r*.94,.48,7.8+tone,3.3,true);
petal(cx-r*.18,cy+r*.49,r*.79,r*.53,-.1,7.5+tone,2.3,true);
petal(cx+r*.31,cy+r*.46,r*.64,r*.49,.2,7.9+tone,4.2,true);
if(!closed){
// Petits pétales froissés dans l'ouverture supérieure, avec ombres entre les replis.
for(let j=0;j<29;j++){let a=j*2.399,rr=r*(.04+.37*Math.sqrt(j/29)),xx=Math.cos(a)*rr,yy=-r*.19+Math.sin(a)*rr*.7;petal(cx+xx,cy+yy,r*range(.16,.25),r*range(.19,.3),range(-1,1),range(5.3,8)+tone,range(0,7),true)}}
if(closed){petal(cx-r*.18,cy-r*.08,r*.73,r*1.15,-.17,8+tone,2.2,true);petal(cx+r*.27,cy-r*.02,r*.62,r*1.01,.24,8.4+tone,4.4,true)}}
function build(){seed=194;p.clearRect(0,0,384,430);
// Tiges inclinées et peu de feuilles, comme sur la photo de référence.
for(let i=0;i<12;i++)stem(range(67,143),range(402,445),range(145,213),range(218,276),range(1,2.4));
for(let i=0;i<3;i++){let x=120+i*32,y=265+i*7;for(let j=0;j<34;j++){let w=Math.sin(j/34*Math.PI)*7;for(let k=-w;k<w;k++)px(x+j*.65+k,y+j,['#2d492a','#4d6537','#798c4d'][k<0?0:k>3?2:1])}}
// Positions et occlusions reconstruites depuis la référence, pas la disposition de l'ancien ramo.
peony(120,83,49,true,-.4,.7);
peony(208,80,50,false,.2,.3);
peony(270,130,48,true,.6,.5);
peony(305,191,54,false,.3,-.2);
peony(106,151,61,true,-.5,.2);
peony(216,150,60,false,-.1,.5);
peony(160,221,58,true,.4,-.2);
peony(249,244,59,true,.2,.8);
}build();let ivory=false,coarse=false;
function show(){ctx.fillStyle=ivory?'#f5efed':'#000';ctx.fillRect(0,0,384,430);ctx.imageSmoothingEnabled=false;if(coarse){let low=document.createElement('canvas');low.width=192;low.height=215;let q=low.getContext('2d');q.drawImage(art,0,0,192,215);ctx.drawImage(low,0,0,384,430)}else ctx.drawImage(art,0,0);document.querySelector('.frame').style.background=ivory?'#f5efed':'#000'}document.querySelector('#background').onclick=()=>{ivory=!ivory;document.querySelector('#background').textContent=ivory?'Fondo negro':'Fondo marfil';show()};document.querySelector('#detail').onclick=()=>{coarse=!coarse;document.querySelector('#detail').textContent=coarse?'Ver detalle fino':'Ver píxeles más grandes';show()};show();
</script></body></html>
