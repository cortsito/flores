'use strict';

const scene=new THREE.Scene();scene.background=new THREE.Color('#8188a2');scene.fog=new THREE.Fog('#8188a2',16,52);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,100);const hemi=new THREE.HemisphereLight('#dbe8ff','#6b596a',2.1);scene.add(hemi);const sun=new THREE.DirectionalLight('#ffd3a3',3.2);sun.position.set(-5,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});sun.shadow.normalBias=.025;scene.add(sun);const rim=new THREE.DirectionalLight('#acbeff',1.8);rim.position.set(4,4,-6);scene.add(rim);

function ball(r,mat,x,y,z,parent=scene,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;parent.add(m);return m}

box(100,.12,100,green,0,-.09,0);box(12,.1,7,stone,0,0,1);for(let i=-5;i<=5;i++)box(.014,.004,7,material('#a79b96'),i*1.1,.053,1);for(let j=-2;j<5;j++)box(12,.004,.014,material('#b7aaa0'),0,.054,j*1.08);

bone(V(x,1.58,-.035),V(x,1.78,-.035),.085,skin,group);const head=new THREE.Group();head.position.set(x,1.94,-.035);group.add(head);ball(.205,skin,0,0,0,head,.88,1.15,.9);ball(.213,hair,0,.095,-.035,head,.95,.8,.88);if(longHair){box(.37,.36,.14,hair,0,-.035,-.16,head);ball(.13,hair,-.17,.02,-.06,head,.7,1.6,.8)}else{ball(.13,hair,-.09,.16,.035,head,1.1,.55,1)}

const arms=[];for(let side of [-1,1]){let shoulder=V(x+side*.265,1.52,.015),elbow=V(x+side*.29,1.15,.22),hand=V(x+side*.16,1.01,.47);let upper=bone(shoulder,elbow,.078,shirt,group),fore=bone(elbow,hand,.057,skin,group),palm=ball(.07,skin,hand.x,hand.y,hand.z,group, .85,.7,1.15);ball(.084,shirt,shoulder.x,shoulder.y,shoulder.z,group);arms.push({side,shoulder,elbow,hand,upper,fore,palm})}return {x,head,arms,skin,group}}

function setBone(mesh,a,b){mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(V(0,1,0),b.clone().sub(a).normalize());mesh.scale.y=a.distanceTo(b)/mesh.geometry.parameters.height}
const ease=v=>{v=THREE.MathUtils.clamp(v,0,1);return v*v*(3-2*v)};let start=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function pose(t){let reach=ease((t-.65)/2),contact=ease((t-2.4)/.5);for(const [actor,side]of [[left,1],[right,-1]]){const arm=actor.arms.find(a=>a.side===side);let target=V(side===1?-.048:.048,1.055,.5+(side===1?.012:0));let hand=arm.hand.clone().lerp(target,reach),elbow=arm.elbow.clone().lerp(V(actor.x+side*.16,1.21,.31),reach);setBone(arm.upper,arm.shoulder,elbow);setBone(arm.fore,elbow,hand);arm.palm.position.copy(hand);arm.palm.rotation.z=side*contact*.3;actor.head.rotation.z=-side*.065*ease((t-.8)/2);actor.head.rotation.x=.07*reach}
