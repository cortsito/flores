<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peonías · Píxel / ASCII</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#f2e9df;font-family:monospace}main{max-width:1180px;margin:auto;padding:36px 28px 25px}header{text-align:center;margin-bottom:26px}h1{font:400 clamp(25px,4vw,40px) Georgia;margin:0 0 12px}p{font-size:11px;line-height:1.7;color:#9b9591;margin:0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0} .frame{border:1px solid #fff;padding:12px;background:#000;aspect-ratio:220/280;display:grid;place-items:center}canvas{display:block;width:100%;height:auto}#pixel{image-rendering:pixelated;image-rendering:crisp-edges}figcaption{display:flex;justify-content:space-between;gap:12px;padding:16px 0;font-size:11px;letter-spacing:2px}figcaption span{color:#77716e;letter-spacing:0;font-size:10px}footer{text-align:center;margin-top:22px;font-size:10px;color:#79736e;line-height:1.8}@media(max-width:650px){main{padding:25px 18px}.comparison{grid-template-columns:1fr;gap:22px}.frame{padding:8px}figcaption{padding:12px 0}}</style></head><body><main><header><h1>Peonías, dos lenguajes.</h1><p>La misma composición, los mismos colores. Dos maneras de dibujar el detalle.</p></header><section class="comparison"><figure><div class="frame"><canvas id="pixel" width="220" height="280" aria-label="Ramo de peonías en pixel art"></canvas></div><figcaption>01 / PÍXEL<span>220 × 280</span></figcaption></figure><figure><div class="frame"><canvas id="ascii" width="880" height="1120" aria-label="El mismo ramo de peonías en caracteres ASCII"></canvas></div><figcaption>02 / ASCII<span>110 × 93 caracteres</span></figcaption></figure></section><footer>Ramo procedural · Sin fotografías ni imágenes generadas · Misma fuente para ambas versiones</footer></main><script>
'use strict';
const source=document.querySelector('#pixel'),p=source.getContext('2d'),output=document.querySelector('#ascii'),ctx=output.getContext('2d');let seed=71;const random=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),range=(a,b)=>a+(b-a)*random(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const palettes={blush:['#57303e','#8b4d63','#b96e87','#df9eb3','#f1c7ce','#fff0df'],rose:['#492638','#763c56','#a65878','#cc86a0','#e9adc0','#ffd3da'],cream:['#625044','#927862','#baa189','#dbc3a9','#eee0c7','#fff3dc']};
function pixel(x,y,color){p.fillStyle=color;p.fillRect(Math.round(x),Math.round(y),1,1)}
function line(ax,ay,bx,by,color,width=1){const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));for(let i=0;i<=n;i++){const t=n?i/n:0,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;for(let k=0;k<width;k++)pixel(x+k,y,color)}}
function leaf(ax,ay,bx,by,width){let dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;const colors=['#163b2c','#245b3b','#3f7b4b','#70a465','#a0be7c'];for(let y=Math.max(0,Math.floor(Math.min(ay,by)-width));y<Math.min(280,Math.max(ay,by)+width);y++)for(let x=Math.max(0,Math.floor(Math.min(ax,bx)-width));x<Math.min(220,Math.max(ax,bx)+width);x++){let qx=x-ax,qy=y-ay,t=(qx*ux+qy*uy)/len,v=-qx*uy+qy*ux;if(t<0||t>1)continue;let half=width*Math.sin(Math.PI*t)**.8;if(Math.abs(v)>half)continue;let shade=half-Math.abs(v)<1?0:v<0?3:2;if(Math.abs(v)<.7)shade=4;if(Math.abs(Math.abs(v)-(t*5%1)*half)<.6&&Math.abs(v)>1)shade=1;pixel(x,y,colors[shade])}}
function petal(cx,cy,a,base,len,w,phase,colors){const cs=Math.cos(a),sn=Math.sin(a),bound=Math.ceil(base+len+w);for(let y=Math.max(0,Math.floor(cy-bound));y<Math.min(280,cy+bound);y++)for(let x=Math.max(0,Math.floor(cx-bound));x<Math.min(220,cx+bound);x++){let dx=x-cx,dy=(y-cy)/.88,u=dx*cs+dy*sn,v=-dx*sn+dy*cs,t=(u-base)/len;if(t<0||t>1)continue;let half=w*Math.sin(t*Math.PI)**.63*(1+.09*Math.sin(t*23+phase));if(Math.abs(v)>half)continue;let fold=v/(half||1),light=3.25-dx*.014-dy*.025+Math.cos(fold*5+t*7+phase)*.55+(t>.55?.45:-.35);if(half-Math.abs(v)<1)light+=.7;if(t<.18)light-=1.4;if(Math.abs(v-w*.18*Math.sin(t*5+phase))<.55&&t>.17&&t<.87)light-=1.3;let idx=clamp(Math.floor(light),0,5);pixel(x,y,colors[idx])}}
function bloom(x,y,r,tone,rotation){let colors=palettes[tone];
// Ombre portée compacte sous chaque corolle : le recouvrement produit la profondeur.
for(let y0=-r*.85;y0<=r*.85;y0++)for(let x0=-r;x0<=r;x0++)if(x0*x0/(r*r)+y0*y0/(r*r*.78)<1)pixel(x+x0+1,y+y0+2,colors[0]);
for(let ring=0;ring<6;ring++){let outer=r*(1-ring*.135),base=outer*.14,len=outer*.86,count=12+ring*2;for(let i=0;i<count;i++){let angle=i*Math.PI*2/count+rotation+ring*1.73+range(-.06,.06);petal(x,y,angle,base,len*range(.94,1.05),outer*range(.25,.33),range(0,7),colors)}}
// Centre fermé et irrégulier, sans disque de marguerite.
for(let j=0;j<12;j++){let a=j*2.399,rr=1+Math.sqrt(j)*.7;pixel(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.8,colors[j%3?2:4])}}
function build(){seed=71;p.fillStyle='#000';p.fillRect(0,0,220,280);
const flowers=[[100,51,31,'blush',.1],[146,76,30,'rose',.4],[65,91,32,'rose',-.3],[112,110,38,'blush',.25],[159,132,30,'cream',-.2],[63,149,31,'blush',-.4],[111,171,37,'rose',.15],[147,194,28,'blush',.5]];
for(const [x,y]of flowers){let last=[range(106,117),264];for(let i=1;i<=60;i++){let t=i/60,u=1-t,xx=u*u*112+2*u*t*(112+(x-112)*.3)+t*t*x,yy=u*u*264+2*u*t*210+t*t*y;line(last[0],last[1],xx,yy,'#58854a',2);last=[xx,yy]}}
for(const f of [[85,93,58,53,7],[140,110,173,72,8],[57,137,34,108,8],[159,166,190,141,9],[79,190,42,184,8],[139,219,173,204,8],[109,250,74,220,10],[116,255,144,227,10]])leaf(...f);
for(const f of flowers)bloom(...f);
leaf(110,258,88,231,7);leaf(115,260,134,235,7);
// La version ASCII échantillonne exactement le même dessin, sans recomposer les fleurs.
const sample=document.createElement('canvas');sample.width=110;sample.height=93;const sc=sample.getContext('2d',{willReadFrequently:true});sc.drawImage(source,0,0,110,93);const data=sc.getImageData(0,0,110,93).data;ctx.fillStyle='#000';ctx.fillRect(0,0,880,1120);ctx.font="13px 'Courier New',monospace";ctx.textBaseline='top';let ramp='.,:;i+tfjxX%#@';for(let y=0;y<93;y++)for(let x=0;x<110;x++){let n=(y*110+x)*4,r=data[n],g=data[n+1],b=data[n+2],lum=.2126*r+.7152*g+.0722*b;if(lum<8)continue;ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillText(ramp[Math.min(12,Math.floor((lum/255)**.75*13))],x*8,y*1120/93)}}
// Attendre la police pour éviter un changement de largeur des caractères au premier affichage.
document.fonts.ready.then(build);
</script></body></html>
